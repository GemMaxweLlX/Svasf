[item-description]
ff-swamp-cable=腐敗物と炭素繊維で絶縁したケーブル。グレバの湿地を通して2つのケーブル陸揚げ局の間に敷設します。グレバでのみ製造。
ff-subsea-cable=ナウヴィスで2つのケーブル陸揚げ局の間の海底に敷設する装甲ケーブル。距離1タイルにつき1本。ナウヴィスでのみ製造。
ff-light-space-platform-starter-pack=軽ロケットサイロで打ち上げられる軽さ（500 kg）。基礎タイルは少なめ。
ff-reefer-container=腐敗するアイテムを運びます。中身の腐敗が5分の1に遅くなります。グレバで製造。
ff-cryo-container=腐敗するアイテムを運び、腐敗を20分の1に遅らせます。満載時の重量は一定です。アクイロで製造。
ff-light-container=満載の軽量コンテナは中身に関係なく常に同じ重さです（重量を参照）。ヴルカヌスで製造。
ff-freight-science-pack=全惑星の部品からアクイロで組み立てられます。
ff-deformed-titansteel-plate=自然に冷えてしまった熱いチタン鋼。鋳造所で鋼とチタンに溶かし戻すことしかできません。
ff-damaged-container=荷下ろしで破損しました。材料の4分の1で修理するか、リサイクルしてください。
ff-freight-consignment=5つの世界の品物を、百年の航海のために封印したもの。軽量コンテナは積荷のシールドの一部となり、一緒に他の星へ旅立ちます。太陽系の果てで「長征キャラバン」が受け取ります。
battery=充電時に4 MJを保持します。
ff-battery-pack=充電時に10 MJを保持します。
landfill=深くない水域の上に置いて、建築できる地形を作ることができます。
bbr-rail-common=深い水域の上に置くことはできません。
ff-interstellar-communicator=ゲームに勝つためにロケットで発射することができます。

