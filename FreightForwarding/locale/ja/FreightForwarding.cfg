[tips-and-tricks-item-description]
ff-sa-permits=いくつかの重要技術にはまず許可が必要です。許可は研究所では研究できません。利用可能になると、惑星の探索済み区域の近くに損傷した研究拠点が現れます（マップタグとチャットメッセージ）。修理パックで修理してから求められたコンテナを入れると、コンテナは消費され、記録を載せた小さなロケットが発射され、重要技術を通常どおり研究できます。拠点は5分後に自爆します。
ff-sa-freight-contract=数世紀にわたる航路を進む星間貨物船「長征キャラバン」はブレーキをかける余裕がありません。太陽系の果てで、待機しているプラットフォームから積荷を飛びながら受け取ります。全惑星の品物から[item=ff-freight-consignment]を作り、果てのプラットフォームに運んでハブに置いてください。貨物便は軽量コンテナごとキャラバンと共に永遠に去ります。契約パネル（ショートカットバーのボタン）で3つの契約から1つを選びます。船ごとに求める数も報酬（ロボット、採掘、研究、インサータ、手作業）も違います。果てに着くだけでは勝利になりません。
ff-sa-hot-titansteel=熱いチタン鋼は2分以内に冷却する必要があります。さもないと変形し、鋳造所で鋼とチタンに溶かし戻すことしかできません。
ff-sa-spoilage-sensor=[item=ff-spoilage-sensor]を列車停留所から4タイル以内に置くと、停車中の列車の積荷の腐敗度をパーセントで出力します。信号による待機条件に使えます。
ff-sa-fluorine-seeps=アクイロのアンモニアの海の底のフッ素湧出孔は石油リグで汲み上げます。
ff-sa-icebreaker=アクイロでは[item=ff-icebreaker]が周囲の氷を砕氷に変え、氷の中へ水路を延ばせます。
ff-sa-swamp-barges=グレバの湿地では船がずっと遅くなります。平底の[item=ff-swamp-barge]は全速を保ちます。
ff-sa-lava-barges=ヴルカヌスでは溶岩の上に水路を建設できます。普通の船はそこで燃えますが、[item=ff-lava-barge]は耐熱です。
ff-sa-bridges=レール支柱は深い水には立てられないため、高架レールは浅い海峡しか渡れません。外洋には引き続き船が必要です。
ff-sa-dredgers=浚渫機は他の惑星でも使えます：ヴルカヌスの溶岩のコバルト噴出孔、フルゴラの深い石油の海のスクラップ海山。浚渫機 Mk2（ヴルカヌス）とMk3（アクイロ）はより大きく速く、モジュール（生産性以外）を使え、より大きなプラットフォームを敷きます。プラットフォームは水路、線路、列車の上には敷かれません。
ff-sa-damaged-containers=荷下ろしの際、コンテナの2%が破損して戻り、1%は失われます。材料の4分の1で手作業で修理するか、リサイクラーに入れてください。
ff-sa-container-tiers=コンテナは4段階：[item=ic-container]通常、[item=ff-reefer-container]冷蔵（グレバ、腐敗5分の1）、[item=ff-light-container]軽量（ヴルカヌス、ロケット内で固定重量）、[item=ff-cryo-container]冷凍（アクイロ、腐敗20分の1）。それぞれ専用の積み込み・荷下ろしタブがあります。腐敗したコンテナには中身が腐敗してできたものが入っています。
ff-sa-planet-chains=各惑星はそこでしか作れないものを作ります：ナウヴィスはチタンと鉛、ヴルカヌスはコバルトとチタン鋼、フルゴラはコバルト・ホルミウムバッテリーパック、グレバは冷蔵コンテナ、アクイロはリチウムパックと貨物サイエンス。バッテリーはどこでも充電できます。
ff-sa-rocket-tiers=最初の[item=ff-light-rocket-silo]は500 kgを運び、ナウヴィスではクレーターの上にぴったり建設する必要があります。通常の[item=rocket-silo]（1 t）は最初に訪れた惑星のサイエンスで解放され、その惑星でのみ作れます。どこにでも建設できます。[item=ff-heavy-rocket-silo]（2 t）はアクイロからです。
ff-vanilla=このグループには、すべてのModされていないtips and tricksが含まれています。
freight-forwarding=Freight Forwardingへようこそ！\n\nあなたはゲーム勝利のために[item=ff-interstellar-communicator] を打ち上げなければなりません。\n\nデモ用のスクリーンショットや動画は、今後のアップデートで追加される予定です。
ff-containerization=コンテナはアイテムを輸送する新しい方法です。\nアイテムは [entity=ic-containerization-machine-1] のコンテナにロードされます。 各コンテナは、そのアイテムの20スタックを保持することができます。 列車や船はインベントリの大きさが非常に小さいので、輸送前に貨物をコンテナ化することが不可欠です。 アイテムがコンテナ化できない場合は電車や船に載せるのではなく、どこで処理すべきかというヒントです。
ff-container-limits=コンテナはロボットでは運べません。 これを実現するいくつかの方法がありますが、それらは使用されるべきではなく、将来のアップデートでパッチを適用される可能性があります。\n\nスパイダートロンと航空機は空のコンテナを運ぶことができますが、積載中のを運べません。
ff-water-types=水域には、浅い水域、普通の水域、深い水域の3種類があります。\n\nプレイヤーも、乗り物も、エイリアンも、みんな浅い水域を通ることができます。浅い水域は[item=waterfill-item] を使って作ることができます。\n埋立地と列車橋は、浅い水域か普通の水域にしか置けません。 埋立地は、タイルを手に持って __ALT_CONTROL__2__mine__ で取り除くことができます。\n深い水域には油田や海山があり、船やホバークラフト、航空機でしか通ることができません。
ff-oil=原油は沖合の油田からのみ採取できます。タンカーには最大3つの[entity=pump] で積載できます。 ポンプを手に持ち、有効な配置位置を確認します。\n原油リグからタンカーへの直接ポンプは、水中パイプからポンプするよりもはるかに速いです。
ff-power=海で電柱を使って電力を移送する方法はありません。 島ごとに発電施設を用意するか、 [entity=ff-charging-station] を使って[item=ff-charged-battery] に電気を貯めて、船や飛行機で運ぶ必要があります。
ff-fuel=車種によっては、独特の燃料要件があります。\n\n自動車、戦車、船舶、航空機は、すべての標準な燃料を受け入れます：[item=wood] [item=coal] [item=solid-fuel] [item=rocket-fuel] [item=nuclear-fuel]\n[entity=mini-locomotive] は基本的な燃料の種類しか受け付けません：[item=wood] [item=coal] [item=solid-fuel]\n[entity=locomotive] はバッテリーのみ使用可能です：[item=ff-charged-battery] [item=ff-charged-battery-pack] そして取り外して再充電しなければならない使用済みのバッテリーを出します。バッテリーは充電中に壊れる可能性が少しあります。
ff-dredging=浚渫プラットフォームは海山の上に設置することができます。\n浚渫で [item=ff-ferrous-nodule] と [item=ff-cupric-nodule] を得ることによって、通常の資源生産を補う[item=iron-ore], [item=copper-ore], と [item=stone] を無限に生産することができます。\n浚渫で [item=ff-cobalt-crust] を得ることによって、どこにも生成されない[item=ff-cobalt-ore] を無限に生産することができます。\n団塊と層は小さなスタックサイズしかなくコンテナに積載することも出来ません。 ですから浚渫プラットフォームでそれらを鉱石することをお勧めします。\n\n地下ベルトは浚渫プラットフォームに設置できません。
ff-rocket-silo=ロケットサイロは、自然に発生するロケットサイロ洞穴にのみ置くことができます。\nゲームに勝つために必要な[item=ff-stellar-communicator] を研究するためには、いくつかの[item=satellite] を打ち上げる必要があります。

