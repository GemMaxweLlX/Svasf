[technology-description]
ff-permit=[planet=__3__]の研究拠点に__1__ × [item=__2__]を届けると、「__4__」の研究が許可されます。この許可が利用可能になると、惑星の探索済み区域の近くに拠点が現れます。コンテナは消費されます。
ff-permit-trigger=[planet=__3__]の研究拠点に__1__ × [item=__2__]を届ける
ff-sonar-buoy=広い水域をスキャンします。ソナーはレーダーや地震スキャンよりずっと遠くまで届きますが、陸地に遮られます。
ff-light-rocket-silo=ナウヴィスではロケットサイロ用クレーターにのみ建設できる軽ロケットサイロ（500 kg）、小型着陸パッド、軽量宇宙プラットフォームスターターパック。
ff-heavy-lift-rockets=どこにでも建設できるフルサイズのロケットサイロ（1000 kg）、貨物着陸パッド、宇宙プラットフォームスターターパック。\nこの技術にはヴルカヌス、フルゴラ、グレバ用の3つのバージョンがあり、どれか1つを研究すると他も完了します。\nこれらの惑星にはそれぞれ現地の素材を使った独自のロケットサイロのレシピがあり、その惑星でのみ作れます。
ff-heavy-rocket-silo=2000 kgを運ぶロケットサイロ。ロケット部品はチタン鋼のフレームから作られます。
ff-lithium-battery-pack=最良のバッテリー燃料：25 MJ、加速と最高速度が向上し、放電しません。アクイロで製造。
ff-refrigerated-containers=腐敗するアイテム用のコンテナ。グレバで製造。中身の腐敗が__1__分の1に遅くなります。
ff-scanners-mk2=範囲2倍の地震スキャナーとソナーブイ。アクイロで製造。
ff-fast-charging=3倍の速さで動く充電ステーション。フルゴラで製造。
ff-dredging-productivity=団塊とコバルト地殻の浚渫生産性+20%。
ff-cryo-containers=腐敗を20分の1に遅らせる、満載時の重量が一定のコンテナ。アクイロで製造。
ff-light-containers=満載時の重量が一定のタングステン製コンテナ：重い品物のロケット打ち上げがずっと安くなります。ヴルカヌスで製造。
ff-heavy-cargo-ship=船倉が2倍の貨物船。
ff-fast-cargo-ship=速度1.5倍の貨物船。
ff-freight-science-pack=輸送サイエンス、チタン鋼、充電済みバッテリーパック、冷蔵コンテナ、リチウムからアクイロで組み立てるサイエンスパック。極低温サイエンスを使うすべての技術に必要です。
ff-rolling-stock-mk2=容量1.5倍の貨物ワゴンと液体ワゴン。ヴルカヌスで製造。
ff-locomotive-mk3=最速の機関車。アクイロで製造。
ff-locomotive-mk2=より速く強力な機関車。フルゴラで製造。
ff-lava-barge=ヴルカヌスの溶岩湖用の耐熱船。溶岩の上に水路を建設でき、他の船はそこで燃えます。
ff-icebreaker=アクイロの氷に水路を切り開く船。
ff-swamp-barge=グレバの湿地用の平底船。他の船はそこでずっと遅くなります。
ff-dredger-mk3=重浚渫機：最速、モジュールスロット4。
ff-dredger-mk2=モジュールスロット付きの、より大きく速い浚渫機。
ff-interstellar-freight-contract=星間貨物船の列「長征キャラバン」は、ブレーキをかけずに太陽系の果てを通過し、積荷を飛びながら受け取ります。宇宙プラットフォームのハブに貨物便を積んでそこで待ってください。最初に達成した契約で勝利です（果てに着くだけでは勝利になりません）。キャラバンは一度に3つの契約を提示し、それぞれ規模と報酬が異なります（契約パネルで選択、ショートカットバーのボタン）。
ff-sea-infrastructure=港湾クレーン、ケーブルターミナル、海底ケーブル、洋上風力タービン、潮力発電所。
ff-transport-science-pack=大陸間物流と石油処理の研究を可能にします。
ff-seismic-scanner=地下スキャンはレーダーよりも遠くまで到達できますが、つながっている陸地の中だけです。
ff-dredging=海山から多金属団塊を回収し、無限の資源に加工します。
ff-advanced-railway=バッテリー駆動の列車は、より多くの荷物を積んで、より遠くまで移動することができます。
ff-battery-charging=充電された電池を使って電力を輸送します。
ff-battery-pack=密度と信頼性の高い可搬式電力貯蔵。
ff-cobalt-processing=海山にコバルト層を発見します。先端電池技術に役立ち、鉛やチタンの無限の供給源となります。
ff-titansteel-processing=自然界に存在する溶岩プールでチタン鋼を製錬します。冷却の過程で蒸気が発生し、発電に利用できます。
landfill=深くない水域の上に置いて、建築できる土地を作ることができます。
lex-flying-cargo-ships=武器を持たない長距離飛行機で、他の島の前哨基地を遠隔操作で建設するのに便利です。
ff-rocket-silo=ロケットを宇宙に打ち上げ可能にする。\nロケットサイロはロケットサイロ洞穴にのみ置くことができます。
ff-interstellar-communication=星間通信機を宇宙に打ち上げ、ゲームに勝利することを可能にします。

