[ff-contract]
victory-message=キャラバンの最初の船が5つの世界の品物を星々の間の闇へ運び去りました。あなたの工場は今や太陽系の外にも知られ、さらに多くの船がやって来ます。
victory-title=長征キャラバンの一員に
pickup=キャラバンの船が果てを通過し、__1__便を受け取りました（__2__ / __3__）。
signal=果ての向こうからの信号：長征キャラバンがこの星系を通過し、貨物を飛びながら受け取ります。5つの世界の品物を百年分封印して。契約パネル（ショートカットバーのボタン）で契約を選び、太陽系の果てのプラットフォームへ貨物便を届けてください。
accepted=契約__1__を受諾：__2__、__3__ × [item=__4__]。
new-offers=新しいキャラバンの船が近づいています：契約パネルで契約__1__を選んでください。
fulfilled-type=契約__1__（__2__）達成！船は積荷を積んで闇の中へ去りました。報酬：__3__。
refreshed=新しいキャラバンの船が通過中：契約のオファーが変わりました。
penalty=遅延ペナルティ：+__1__便、契約の必要数は__2__になりました。
overdue=契約__1__が期限切れです！キャラバンの船は待っていますが、10分ごとに要求が増えます。
reputation-up=期限内に納品：評判 +__1__（現在 __2__）。
reputation-down=遅れて納品：評判 −__1__（現在 __2__）。評判が悪いと契約が大きくなります。
rare-unlocked=キャラバンはあなたを信頼しています：珍しい船が契約を提示するようになります。

