migrated-from-1-space-age=[Freight Forwarding] Space Ageが有効です：コバルト地殻はヴルカヌスでのみ浚渫されるようになったため、ナウヴィスでコバルトを採っていた浚渫機は停止します（海底の団塊と溶岩プールは動き続けます）。このセーブを以前の方法で続けるには、スタートアップ設定「クラシックモード」をオンにしてください。
