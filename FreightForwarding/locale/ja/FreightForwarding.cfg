[mod-setting-description]
ff-delivery-permits=FF + Space Age専用の仕組み：重要技術にはまず許可が必要で、惑星の探索済み区域の近くに現れる研究拠点へコンテナを届けると得られます。
ff-island-terrain-by-default=「Freight Forwarding」マッププリセットを選ばなくても（デフォルトプリセットやSpace Ageのゲームなど）、ナウヴィスにFreight Forwardingの島の地形を使います。
ff-classic-mode=Space Ageがあっても1.xと全く同じFreight Forwarding：ナウヴィスに溶岩プール、コバルト、チタン鋼、ナウヴィスではクレーターが必要な1種類のロケットサイロ、チタン鋼フレームとバッテリーパックを使うロケット部品。他の惑星はSpace Ageのままです。
ff-transport-science-planet-techs=オフの場合、他の惑星のサイエンスを使う技術には輸送サイエンスが不要になります。
ff-wagon-mk2-capacity=通常のワゴンに対する貨物ワゴンと液体ワゴン Mk2 の容量。
ff-heavy-ship-speed=通常の貨物船に対する大型貨物船（船倉2倍）の速度。
ff-swamp-ship-speed=グレバの湿地での船（湿地バージを除く）の速度上限。最高速度に対する割合。
ff-dredger-productivity-modules=海山は枯渇しないため、生産性モジュールは浚渫を非常に強力にします。
ff-scrap-dredging-amount=浚渫機がスクラップ海山から1サイクル（速度1で50秒）に得るスクラップの量。
ff-fluorine-seep-yield=アクイロのフッ素湧出孔の産出量（通常の油田に対する%）。
ff-light-container-weight=ロケット内の満載の軽量コンテナまたは冷凍コンテナの固定重量。1000 kgではバラ積みと比べて利点がありません。
ff-freight-contract-size=勝利のために太陽系の果てへ届ける貨物便の数。
ff-contract-penalty=期限を過ぎると、達成されるまで10分ごとに契約がこの割合だけ増えます。
ff-contract-deadline=受諾後、基本規模の契約を達成するまでの時間。大きな契約にはその分長い時間が与えられます。
ff-contract-refresh=この間隔ですべてのオファーが新しいものに入れ替わります。
ff-contract-offer-lifetime=この時間（±25%）内に受諾されなかったオファーは消えます。
ff-revert-locomotive-fuel-category=機関車に電池を供給するだけではなく、燃焼可能な燃料の使用を許可します。 以前のバージョンのFreight Forwardingからアップグレードし、列車の燃料補給を再度用意しなたくない場合は有効にしてください。\nこの設定は今後のアップデートで削除される可能性があります。

