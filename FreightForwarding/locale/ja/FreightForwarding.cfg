[entity-description]
ff-research-post=長征キャラバンの最初の遠征隊が残した基地。損傷した状態で見つかります。修理パックで修理してから、求められたコンテナを届けると、小さなロケットで記録を打ち上げ、重要技術の研究許可を与えます。5分後に自爆します。
ff-cable-landing=海底（ナウヴィス）または湿地（グレバ）に敷設するケーブルの両端。両岸に1つずつ建設し、片方を開いてケーブルの行き先を選びます。距離、必要なケーブル（1タイルにつき1本、惑星ごとに別）、敷設時間が表示されます。敷設後は通常の電線と同じく双方向に電力を送ります。
ff-sonar-buoy=広い水域をスキャンします。陸地に遮られます。
ff-small-cargo-landing-pad=インベントリ20スロットだけの安価な着陸パッド。その場で通常の貨物着陸パッドにアップグレードできます。
ff-light-rocket-silo=最初の宇宙飛行のための安価なロケットサイロ。ロケットは500 kgしか運べず、ロケット部品が20個必要です。\nナウヴィスではロケットサイロ用クレーターの上にぴったり建設する必要があります。他の惑星ではどこでも建設できます。
ff-heavy-rocket-silo=ロケットは2000 kgを運びます。ロケット部品にはヴルカヌスの溶岩プールでのみ製錬されるチタン鋼のフレームが必要です。どこにでも建設できます。
ff-cobalt-vent=溶岩湖にできるコバルトに富んだ地殻。浚渫プラットフォームを建設してコバルト地殻を採掘します。
ff-fast-charging-station=バッテリーを3倍の速さで充電します。
ff-fuel-depot=列車停留所か港から10タイル以内に設置します。停車中の列車と船はここから燃料を補給し、使用済み燃料（空のバッテリー）を預けます。
ff-heavy-cargo-ship=船倉が2倍の貨物船。ただし遅い。
ff-fast-cargo-ship=炭化タングステンエンジンの貨物船：速度1.5倍。
ff-fluid-wagon-mk2=タングステンタンク：容量1.5倍（設定）。
ff-cargo-wagon-mk2=タングステンフレーム：容量1.5倍（設定）。
ff-locomotive-mk3=リチウム駆動：速度1.5倍、出力2.2倍。
ff-locomotive-mk2=超伝導モーター：速度1.25倍、出力1.6倍。
ff-lava-barge=耐熱シールドを備えた貨物船。他の船は溶岩の上で燃えます。
ff-spoilage-sensor=列車停留所から4タイル以内に設置します。停車中の列車の積荷の腐敗度をパーセントで出力します（最も腐敗したスタックと平均）。信号による待機条件に使います。
ff-icebreaker=周囲の氷を砕いて砕氷にし、水路をさらに延ばせるようにします。船倉は小さめ。
ff-swamp-barge=平底船：グレバの湿地でも速度が落ちない唯一の船。
ff-fluorine-seep=アンモニアの海の底から湧き出るフッ素。石油リグを建設してください。
ff-scrap-seamount=深い石油の海の底に積もった残骸。浚渫機を建設してください。
ff-dredger-mk3=重浚渫機：3倍の速度、モジュールスロット4。海山の上に建設します。
ff-dredger-mk2=より大きな浚渫機：2倍の速度、モジュールスロット2。海山の上に建設します。
ff-tidal-generator=浅瀬に建設します。潮の満ち引き（20分周期）に応じて最大600 kW。
ff-offshore-wind-turbine=水上に建設します。ゆっくり変化する風に応じて最大1 MW。
ff-cable-terminal=電線は64タイル届きますが、接続できるのは他のケーブルターミナルだけです。海を越えて他の島へ電力を送ります。供給範囲はとても狭いです。
ff-port-crane=長いリーチ（3タイル）と大きなハンドを持つバルクインサータ。岸壁から船への積み込みと荷下ろしに。
ff-seismic-scanner=つながっている陸地の中をスキャンし、大量の汚染を発生させます。水域から16タイル以内に設置できません。
ff-seamount=海山では無限に多金属団塊を浚渫することができます。
ff-rocket-silo=宇宙からの科学データを受信するためのロケットを製作し、打ち上げるために使用されます。\n自然発生したロケットサイロ洞穴にしか設置できません。

