[ff-contract-description]
workshop=器用な手を持つ空飛ぶ工房。要求は少なめで、手作業のコツで支払います。
drones=貨物ドローンの母船。より多く運べるドローンフレームで支払います。
cargo=巨大な貨物船。積み込み機械の設計図で支払います。
archive=十数の世界の研究アーカイブを運んでいます。その写しで支払います。
survey=何千もの小惑星や衛星を調査してきました。探鉱データで支払います。
navigation=キャラバンの先導役。何世紀も集めた航路アルゴリズムで支払います。
flagship=キャラバンの旗艦。実績ある相手しか信用しません。自らのドローン艦隊の設計図で支払います。
forge=小惑星を丸ごと採掘する鍛冶船。採掘の秘訣で支払います。
observatory=深宇宙の観測所。何世紀にもわたる観測データで支払います。

[ff-contract-reward]
