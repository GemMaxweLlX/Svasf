workshop=Eine fliegende Werkstatt mit geschickten Händen. Will weniger, zahlt mit Handwerkskniffen.
drones=Ein Träger von Frachtdrohnen. Zahlt mit Drohnenrahmen, die mehr tragen.
cargo=Ein riesiger Frachter. Zahlt mit den Bauplänen seiner Lademaschinen.
archive=Trägt die Forschungsarchive von einem Dutzend Welten. Zahlt mit Kopien.
survey=Hat Tausende Asteroiden und Monde vermessen. Zahlt mit Prospektionsdaten.
navigation=Ein Pfadfinder der Karawane. Zahlt mit über Jahrhunderte gesammelten Routing-Algorithmen.
flagship=Das Flaggschiff der Karawane. Vertraut nur bewährten Partnern; zahlt mit den Bauplänen seiner Drohnenflotte.
forge=Ein Schmiedeschiff, das ganze Asteroiden abbaut. Zahlt mit seinen Abbaugeheimnissen.
observatory=Ein Observatorium des tiefen Alls. Zahlt mit Jahrhunderten an Beobachtungen.

