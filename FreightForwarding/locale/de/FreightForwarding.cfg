[entity-description]
ff-insurance-office=Wird ein Güterwagen, Schiff, Boot oder Spidertron zerstört, wird ein Teil der Ladung in das nächste Versicherungsbüro auf demselben Planeten ausgezahlt. Was nicht passt, geht verloren.
ff-pipeline-landing=Ein Ende einer Unterwasser-Pipeline. Baue zwei Stationen einander gegenüber auf einer Linie, bis zu __1__ Felder entfernt, und öffne eine, um die Pipeline über den Meeresboden zu verlegen (__2__ Segment(e) pro Feld).
ff-research-post=Eine Station der ersten Expedition der Langen Karawane, beschädigt aufgefunden. Liefere das darüber angezeigte Reparaturmaterial, um sie wiederherzustellen, dann die verlangten Container: Sie schickt ihre Aufzeichnungen in einer Frachtkapsel los und erteilt eine Genehmigung, eine Schlüsseltechnologie zu erforschen. 5 Minuten später zerstört sie sich selbst.
ff-cable-landing=Beide Enden eines Kabels, das am Meeresgrund (Nauvis) oder durch die Sümpfe (Gleba) verlegt wird. Baue je eine an jedem Ufer, öffne eine und wähle, wohin das Kabel führt: Entfernung, benötigtes Kabel (1 pro Feld, je Planet ein eigenes) und Verlegezeit werden angezeigt. Nach dem Verlegen funktioniert es wie ein normaler Draht, in beide Richtungen.
ff-sonar-buoy=Scannt große Wasserflächen. Wird von Landmassen blockiert.
ff-small-cargo-landing-pad=Eine günstigere Landeplattform mit nur 20 Inventarplätzen. Kann vor Ort zu einer normalen Landeplattform aufgerüstet werden.
ff-light-rocket-silo=Ein günstigeres Raketensilo für die ersten Flüge ins All. Raketen heben nur 500 kg und brauchen 20 Raketenteile.\nAuf Nauvis kann es nur genau in einem Raketensilo-Krater gebaut werden, auf anderen Planeten überall.
ff-heavy-rocket-silo=Raketen heben 2000 kg. Raketenteile brauchen Titanstahlrahmen, die nur in den Lavabecken von Vulcanus geschmolzen werden. Kann überall gebaut werden.
ff-cobalt-vent=Kobaltreiche Kruste in einem Lavasee. Baue eine Baggerplattform darauf, um Kobaltkruste abzubauen.
ff-fast-charging-station=Lädt Batterien dreimal so schnell.
ff-fuel-depot=Innerhalb von 10 Feldern eines Bahnhofs oder Hafens platzieren. Haltende Züge und Schiffe tanken daraus und geben verbrauchten Treibstoff (leere Batterien) ab.
ff-heavy-cargo-ship=Ein Frachtschiff mit doppeltem Laderaum, aber langsamer.
ff-fast-cargo-ship=Ein Frachtschiff mit Wolframkarbid-Motoren: 1,5-mal so schnell.
ff-fluid-wagon-mk2=Wolframtank: 1,5-fache Kapazität (Einstellung).
ff-cargo-wagon-mk2=Wolframrahmen: 1,5-fache Kapazität (Einstellung).
ff-locomotive-mk3=Lithiumantrieb: 1,5-mal so schnell, 2,2-mal so stark.
ff-locomotive-mk2=Supraleitende Motoren: 1,25-mal so schnell, 1,6-mal so stark.
ff-lava-barge=Ein hitzegeschütztes Frachtschiff. Andere Schiffe verbrennen auf Lava.
ff-spoilage-sensor=Innerhalb von 4 Feldern eines Bahnhofs platzieren. Gibt aus, wie verdorben die Ladung des haltenden Zuges ist, in Prozent (am stärksten verdorbener Stapel und Durchschnitt). Für Wartebedingungen per Signal.
ff-icebreaker=Bricht das Eis um sich herum zu Treibeis, auf dem Wasserwege weitergebaut werden können. Kleiner Laderaum.
ff-swamp-barge=Flachbodig: das einzige Schiff, das in den Sümpfen von Gleba nicht kriecht.
ff-fluorine-seep=Fluor, das vom Grund des Ammoniakozeans aufsteigt. Baue eine Bohrinsel darauf.
ff-scrap-seamount=Wrackteile am Grund des tiefen Ölozeans. Baue einen Nassbagger darauf.
ff-dredger-mk3=Ein schwerer Nassbagger: dreimal so schnell, 4 Modulplätze. Wird auf einem Tiefseeberg gebaut.
ff-dredger-mk2=Ein größerer Nassbagger: doppelt so schnell, 2 Modulplätze. Wird auf einem Tiefseeberg gebaut.
ff-tidal-generator=Wird auf flachem Wasser gebaut. Bis zu 600 kW, den Gezeiten folgend (20-Minuten-Zyklus).
ff-offshore-wind-turbine=Wird auf Wasser gebaut. Bis zu 1 MW, je nach Wind, der sich langsam ändert.
ff-cable-terminal=Seine Kabel reichen 64 Felder weit, aber nur zu anderen Kabelterminals: Strom über das Meer zu anderen Inseln. Sehr kleiner Versorgungsbereich.
ff-port-crane=Ein Massengreifarm mit großer Reichweite (3 Felder) und großer Hand, um Schiffe vom Kai aus zu beladen und zu entladen.

