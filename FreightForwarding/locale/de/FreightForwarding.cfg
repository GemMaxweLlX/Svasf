migrated-from-1=[Freight Forwarding] Spielstand aus Freight Forwarding 1.x auf 2.0 aktualisiert. Inseln, Lavabecken, Nassbagger und Container bleiben erhalten; neue Kartenbereiche werden mit dem 2.x-Gelände erzeugt.
migrated-from-1-space-age=[Freight Forwarding] Space Age ist aktiv: Kobaltkruste wird jetzt nur auf Vulcanus gebaggert, daher stoppen Nassbagger auf Nauvis, die Kobalt förderten (Meeresbodenknollen und Lavabecken arbeiten weiter). Um diesen Spielstand wie früher weiterzuspielen, aktiviere die Starteinstellung „Klassischer Modus“.

