[mod-setting-description]
ff-revert-locomotive-fuel-category=Lokomotiven können wieder normalen Brennstoff statt nur Batterien nutzen. Aktivieren, wenn du von einer älteren Version von Freight Forwarding aktualisierst und die Betankung deiner Züge nicht umbauen willst.\nDiese Einstellung kann in künftigen Updates entfernt werden.
ff-contract-great-period=Wie oft die Große Karawane mit einem riesigen Vertrag und einer einzigartigen Belohnung kommt.
ff-insurance-payout=Anteil jedes Stapels der Ladung eines zerstörten Fahrzeugs, der in das nächste Versicherungsbüro geht.
ff-delivery-permits=Exklusive Mechanik von FF + Space Age: Schlüsseltechnologien brauchen zuerst eine Genehmigung, die man erhält, indem man einen Container zu einem Forschungsposten liefert, der nahe dem erkundeten Gebiet eines Planeten erscheint.
ff-island-terrain-by-default=Das Inselgelände von Freight Forwarding für Nauvis verwenden, auch wenn die Kartenvorlage „Freight Forwarding“ nicht gewählt ist (z. B. Standardvorlage oder Space-Age-Spiel).
ff-classic-mode=Freight Forwarding genau wie in 1.x, auch mit Space Age: Lavabecken, Kobalt und Titanstahl auf Nauvis, ein Raketensilo, das auf Nauvis einen Krater braucht, Raketenteile mit Titanstahlrahmen und Batteriepacks. Andere Planeten bleiben wie in Space Age. Aus: erweiterter Modus mit den Space-Age-Funktionen dieses Mods.
ff-transport-science-planet-techs=Wenn aus, brauchen Technologien mit der Wissenschaft eines anderen Planeten keine Transportwissenschaft.
ff-wagon-mk2-capacity=Kapazität der Güter- und Kesselwagen Mk2 im Vergleich zu normalen Wagen.
ff-heavy-ship-speed=Geschwindigkeit des schweren Frachtschiffs (Laderaum ×2) im Vergleich zum normalen.
ff-swamp-ship-speed=Geschwindigkeitsgrenze für Schiffe (außer Sumpfkähnen) in den Sümpfen von Gleba, als Anteil ihrer Höchstgeschwindigkeit.
ff-dredger-productivity-modules=Tiefseeberge erschöpfen sich nie, daher machen Produktivitätsmodule das Baggern sehr stark.
ff-scrap-dredging-amount=Wie viel Schrott ein Nassbagger pro Zyklus aus einem Schrott-Tiefseeberg holt (50 s bei Geschwindigkeit 1).
ff-fluorine-seep-yield=Ertrag der Fluorquellen auf Aquilo, in % eines normalen Ölfelds.
ff-light-container-weight=Festes Gewicht eines vollen Leicht- oder Kryocontainers in einer Rakete. 1000 kg = kein Vorteil gegenüber loser Ware.
ff-freight-contract-size=Wie viele Frachtsendungen zum Rand des Sonnensystems geliefert werden müssen, um zu gewinnen.
ff-contract-penalty=Nach Ablauf der Frist wächst der Vertrag alle 10 Minuten um diesen Anteil seiner Größe, bis er erfüllt ist.
ff-contract-deadline=Zeit, um einen Vertrag der Grundgröße nach der Annahme zu erfüllen; größere Verträge bekommen anteilig mehr.
ff-contract-refresh=So oft werden alle Angebote durch neue ersetzt.
ff-contract-offer-lifetime=Ein Angebot, das nicht in dieser Zeit (±25 %) angenommen wird, verschwindet.

