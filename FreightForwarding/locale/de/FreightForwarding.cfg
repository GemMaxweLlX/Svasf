[tips-and-tricks-item-description]
ff-sa-permits=Manche Schlüsseltechnologien brauchen zuerst eine Genehmigung. Sie lässt sich nicht im Labor erforschen: Sobald sie verfügbar ist, erscheint nahe dem erkundeten Gebiet des Planeten ein beschädigter Forschungsposten (Kartenmarkierung und Nachricht). Liefere das darüber angezeigte Reparaturmaterial, um ihn wiederherzustellen, dann den verlangten Container: Er wird verbraucht, eine Frachtkapsel startet mit den Aufzeichnungen, und die Schlüsseltechnologie kann normal erforscht werden. 5 Minuten später zerstört sich der Posten selbst.
ff-sa-freight-contract=Die Lange Karawane, interstellare Frachter auf einer jahrhundertelangen Route, kann es sich nicht leisten zu bremsen. Am Rand des Sonnensystems nimmt sie Fracht im Vorbeiflug von wartenden Plattformen auf. Packe [item=ff-freight-consignment] aus Waren aller Planeten, bringe sie zu einer Plattform am Rand und lagere sie in ihrem Hub. Sendungen fliegen für immer mit der Karawane davon, Leichtcontainer eingeschlossen. Wähle einen von drei Verträgen im Vertragsfenster (Schaltfläche in der Schnellzugriffsleiste): Jedes Schiff will eine andere Menge und zahlt anders (Roboter, Bergbau, Forschung, Greifarme, Handfertigung). Den Rand nur zu erreichen ist noch kein Sieg.
ff-sa-hot-titansteel=Heißer Titanstahl muss innerhalb von 2 Minuten gekühlt werden. Sonst verformt er sich, und die Gießerei kann ihn nur wieder zu Stahl und Titan einschmelzen.
ff-sa-spoilage-sensor=Platziere einen [item=ff-spoilage-sensor] innerhalb von 4 Feldern eines Bahnhofs. Er gibt das Verderben der Ladung des haltenden Zuges in Prozent aus, für Wartebedingungen per Signal.
ff-sa-fluorine-seeps=Fluorquellen am Grund des Ammoniakozeans von Aquilo werden von der Bohrinsel gefördert.
ff-sa-icebreaker=Auf Aquilo verwandelt der [item=ff-icebreaker] das Eis um sich in Treibeis, sodass Wasserwege weiter ins Eis gebaut werden können.
ff-sa-swamp-barges=In den Sümpfen von Gleba fahren Schiffe viel langsamer. Der flachbodige [item=ff-swamp-barge] behält die volle Geschwindigkeit.
ff-sa-lava-barges=Auf Vulcanus können Wasserwege auf Lava gebaut werden. Normale Schiffe verbrennen dort; der [item=ff-lava-barge] ist hitzegeschützt.
ff-sa-bridges=Schienenstützen können nicht in tiefem Wasser stehen, daher überbrücken Hochbahnen nur flache Meerengen. Die offene See braucht weiterhin Schiffe.
ff-sa-dredgers=Nassbagger arbeiten auch auf anderen Planeten: Kobaltschlote in der Lava von Vulcanus, Schrott-Tiefseeberge im tiefen Ölozean von Fulgora. Nassbagger Mk2 (Vulcanus) und Mk3 (Aquilo) sind größer und schneller, nehmen Module (ohne Produktivität) und legen größere Plattformen. Plattformen werden nicht über Wasserwege, Schienen oder Züge gelegt.
ff-sa-damaged-containers=Beim Entladen kommen 2 % der Container beschädigt zurück, 1 % geht verloren. Repariere sie von Hand für ein Viertel der Materialien oder wirf sie in einen Recycler.
ff-sa-container-tiers=Container gibt es in vier Stufen: [item=ic-container] normal, [item=ff-reefer-container] Kühlcontainer (Gleba, 5-mal langsameres Verderben), [item=ff-light-container] Leichtcontainer (Vulcanus, festes Gewicht in Raketen) und [item=ff-cryo-container] Kryocontainer (Aquilo, 20-mal langsameres Verderben). Jeder hat eigene Lade- und Entladetabs. Ein verdorbener Container enthält das, wozu sein Inhalt verdirbt.
ff-sa-planet-chains=Jeder Planet stellt her, was nur er kann: Titan und Blei auf Nauvis, Kobalt und Titanstahl auf Vulcanus, Kobalt-Holmium-Batteriepacks auf Fulgora, Kühlcontainer auf Gleba, Lithiumpacks und Frachtwissenschaft auf Aquilo. Batterien können überall geladen werden.
ff-sa-rocket-tiers=Das erste [item=ff-light-rocket-silo] hebt 500 kg und muss auf Nauvis genau in einem Krater gebaut werden. Das normale [item=rocket-silo] (1 t) wird mit der Wissenschaft des ersten besuchten Planeten freigeschaltet und nur dort hergestellt; es kann überall gebaut werden. Das [item=ff-heavy-rocket-silo] (2 t) kommt von Aquilo.

