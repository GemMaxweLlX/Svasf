[technology-description]
ff-cargo-insurance=Versicherungsbüros erstatten einen Teil der Ladung zerstörter Wagen, Schiffe, Boote und Spidertrons (siehe Karteneinstellungen).
ff-subsea-pipeline=Pipelines über den Meeresboden, bis zu __1__ Felder: eine Station an jedem Ufer und das Rohr dazwischen. Mit Fluid Must Flow gibt es auch eine Kanal-Anlandestation mit riesigem Durchsatz.
ff-tank-containers=Container für Flüssigkeiten, je __1__ Einheiten: in einer Chemiefabrik befüllt und geleert. Flüssigkeiten reisen per Schiff, Zug und Rakete ohne Tanker oder Fässer.
ff-caravan-alliance=Die Karawane leitet das Signal deines intergalaktischen Transceivers zu den Sternen weiter. Wird durch die Erfüllung des ersten interstellaren Frachtvertrags gewährt.
ff-caravan-alliance-trigger=Erfülle den ersten interstellaren Frachtvertrag
ff-permit=Liefere __1__ × [item=__2__] zum Forschungsposten auf [planet=__3__], um „__4__“ erforschen zu dürfen. Der Posten erscheint nahe dem erkundeten Gebiet des Planeten, sobald die Genehmigung verfügbar ist; die Container werden verbraucht.
ff-permit-trigger=Liefere __1__ × [item=__2__] zum Forschungsposten auf [planet=__3__]
ff-sonar-buoy=Scannt große Wasserflächen. Sonar reicht viel weiter als Radar oder seismische Scans, wird aber von Landmassen blockiert.
ff-light-rocket-silo=Leichte Raketensilos (500 kg), die auf Nauvis nur in Raketensilo-Kratern gebaut werden können, kleine Landeplattformen und leichte Raumplattform-Starterpakete.
ff-heavy-lift-rockets=Vollwertige Raketensilos (1000 kg), die überall gebaut werden können, Frachtlandeplattformen und Raumplattform-Starterpakete.\nEs gibt drei Versionen dieser Technologie, je eine für Vulcanus, Fulgora und Gleba: die Erforschung einer schließt die anderen ab.\nJeder dieser Planeten hat ein eigenes Raketensilo-Rezept aus lokalen Materialien, das nur dort hergestellt werden kann.
ff-heavy-rocket-silo=Raketensilos, die 2000 kg heben. Ihre Raketenteile werden aus Titanstahlrahmen gebaut.
ff-lithium-battery-pack=Der beste Batterietreibstoff: 25 MJ, bessere Beschleunigung und Höchstgeschwindigkeit, und er verliert seine Ladung nicht. Wird auf Aquilo hergestellt.
ff-refrigerated-containers=Container für verderbliche Gegenstände, auf Gleba hergestellt. Der Inhalt verdirbt __1__-mal langsamer.
ff-scanners-mk2=Seismische Scanner und Sonarbojen mit doppelter Reichweite. Werden auf Aquilo hergestellt.
ff-fast-charging=Ladestationen, die dreimal so schnell arbeiten. Werden auf Fulgora hergestellt.
ff-dredging-productivity=+20 % Produktivität beim Baggern von Knollen und Kobaltkruste.
ff-cryo-containers=Container für verderbliche Gegenstände, die 20-mal langsamer verderben, mit festem Gewicht im vollen Zustand. Werden auf Aquilo hergestellt.
ff-light-containers=Wolframcontainer mit festem Gewicht im vollen Zustand: viel günstigere Raketenstarts für schwere Güter. Werden auf Vulcanus hergestellt.
ff-heavy-cargo-ship=Frachtschiffe mit doppeltem Laderaum.
ff-fast-cargo-ship=1,5-mal so schnelle Frachtschiffe.
ff-freight-science-pack=Ein Wissenschaftspaket, auf Aquilo aus Transportwissenschaft, Titanstahl, einem geladenen Batteriepack, einem Kühlcontainer und Lithium zusammengebaut. Wird von allen Technologien mit kryogener Wissenschaft benötigt.
ff-rolling-stock-mk2=Güter- und Kesselwagen mit 1,5-facher Kapazität. Werden auf Vulcanus hergestellt.
ff-locomotive-mk3=Die schnellsten Lokomotiven. Werden auf Aquilo hergestellt.
ff-locomotive-mk2=Schnellere und stärkere Lokomotiven. Werden auf Fulgora hergestellt.
ff-lava-barge=Hitzegeschützte Schiffe für die Lavaseen von Vulcanus. Wasserwege können auf Lava gebaut werden; andere Schiffe verbrennen dort.
ff-icebreaker=Schiffe, die Fahrrinnen durch das Eis von Aquilo brechen.
ff-swamp-barge=Flachbodige Schiffe für die Sümpfe von Gleba, in denen andere Schiffe viel langsamer fahren.
ff-dredger-mk3=Ein schwerer Nassbagger: der schnellste, mit 4 Modulplätzen.
ff-dredger-mk2=Ein größerer, schnellerer Nassbagger mit Modulplätzen.
ff-interstellar-freight-contract=Die Lange Karawane, eine Kette interstellarer Frachter, passiert den Rand des Sonnensystems ohne zu bremsen und nimmt Fracht im Vorbeiflug auf. Warte dort mit einer Raumplattform und Frachtsendungen in ihrem Hub. Der erste erfüllte Vertrag gewinnt das Spiel (den Rand nur zu erreichen genügt nicht); die Karawane bietet jeweils drei Verträge mit eigener Größe und Belohnung an (Auswahl im Vertragsfenster, Schaltfläche in der Schnellzugriffsleiste).
ff-sea-infrastructure=Hafenkräne, Kabelterminals, Seekabel, Offshore-Windräder und Gezeitenkraftwerke.
landfill=Kann in flachem Wasser platziert werden, um Gelände zu erstellen, auf dem du bauen kannst.

