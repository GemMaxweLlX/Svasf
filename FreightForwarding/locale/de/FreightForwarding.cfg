[ff-contract]
alliance=alliance=Die Lange Karawane ist jetzt deine Verbündete: Sie leitet das Signal des intergalaktischen Transceivers weiter. Das Ziel ist der Transceiver.
victory-message=Das erste Karawanenschiff hat die Waren von fünf Welten in die Dunkelheit zwischen den Sternen getragen. Deine Fabrik ist jetzt jenseits des Sonnensystems bekannt, und weitere Schiffe kommen.
victory-title=Teil der Langen Karawane
pickup=Ein Karawanenschiff hat den Rand passiert und __1__ Sendungen aufgenommen (__2__ / __3__).
signal=Signal von jenseits des Randes: Die Lange Karawane zieht an diesem System vorbei und nimmt Fracht im Vorbeiflug auf. Waren von fünf Welten, versiegelt für hundert Jahre. Wähle einen Vertrag im Vertragsfenster (Schaltfläche in der Schnellzugriffsleiste) und bringe Sendungen zu einer Plattform am Rand des Sonnensystems.
accepted=Vertrag __1__ angenommen: __2__, __3__ × [item=__4__].
new-offers=Neue Karawanenschiffe nähern sich: Wähle Vertrag __1__ im Vertragsfenster.
fulfilled-type=Vertrag __1__ (__2__) erfüllt! Das Schiff ist beladen und in die Dunkelheit aufgebrochen. Belohnung: __3__.
refreshed=Neue Karawanenschiffe ziehen vorbei: Die Vertragsangebote haben sich geändert.
penalty=Verzugsstrafe: +__1__ Sendungen, der Vertrag verlangt jetzt __2__.
overdue=Vertrag __1__ ist überfällig! Das Karawanenschiff wartet, will aber alle 10 Minuten mehr.
reputation-up=Pünktlich geliefert: Ansehen +__1__ (jetzt __2__).
reputation-down=Verspätet geliefert: Ansehen −__1__ (jetzt __2__). Schlechtes Ansehen macht Verträge größer.
rare-unlocked=Die Karawane vertraut dir jetzt: Seltene Schiffe werden Verträge anbieten.

