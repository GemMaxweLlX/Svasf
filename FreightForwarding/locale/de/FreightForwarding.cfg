[map-gen-preset-description]
ff-ribbon-world=Freight Forwarding auf einer Bandwelt. Weiterhin Inseln, aber die Kartenhöhe ist auf 5 Chunks begrenzt und die Ressourcen sind entsprechend angepasst.\n [font=default-bold][color=blue]Beim Neuwürfeln darauf achten, dass Blei auf der Startinsel ist[/color][/font]
x-default=Die empfohlene Art, Freight Forwarding zu spielen. Meist getrennte große Inseln und weiter verteilte Ressourcen.\nPasse die [font=default-semibold]Feind[/font]-Einstellungen nach Belieben an.
default=[font=default-bold][color=yellow]DIE VANILLA-STANDARDVORLAGE NUTZT NICHT DIE KARTENERZEUGUNG VON FREIGHT FORWARDING.[/color][/font]\nWir empfehlen, oben in der Liste auf „[font=default-bold][color=green]Freight Forwarding Standard[/color][/font]“ zu wechseln.
ff-archipelago=Viele kleine Inseln dicht beieinander: eine kleine Startinsel, wenig Land und viel Meer. Schiffe werden von Anfang an gebraucht.

