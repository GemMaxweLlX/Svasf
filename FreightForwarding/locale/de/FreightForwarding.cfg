[item-description]
ff-pipeline-segment=Ein Rohrstück, das zwischen zwei Anlandestationen über den Meeresboden verlegt wird.
ff-tank-container=Ein Container für Flüssigkeiten. Wird in einer Chemiefabrik befüllt und geleert; Schiffe, Züge und Raketen befördern ihn wie jeden Container.
ff-swamp-cable=Mit Fäulnis und Kohlefaser isoliertes Kabel, das durch die Sümpfe von Gleba zwischen zwei Kabelanlandestationen verlegt wird. Wird nur auf Gleba hergestellt.
ff-subsea-cable=Armiertes Kabel, das am Meeresgrund zwischen zwei Kabelanlandestationen auf Nauvis verlegt wird. Eines pro Feld Entfernung. Wird nur auf Nauvis hergestellt.
ff-light-space-platform-starter-pack=Leicht genug (500 kg) für das leichte Raketensilo. Enthält weniger Fundamentplatten.
ff-reefer-container=Transportiert verderbliche Gegenstände. Der Inhalt verdirbt 5-mal langsamer. Wird auf Gleba hergestellt.
ff-cryo-container=Transportiert verderbliche Gegenstände, die 20-mal langsamer verderben. Ein voller Kryocontainer hat ein festes Gewicht. Wird auf Aquilo hergestellt.
ff-light-container=Ein voller Leichtcontainer wiegt immer gleich viel, egal was darin ist (siehe Gewicht). Wird auf Vulcanus hergestellt.
ff-freight-science-pack=Auf Aquilo aus Teilen aller Planeten zusammengebaut.
ff-deformed-titansteel-plate=Heißer Titanstahl, der von selbst abgekühlt ist. Die Gießerei kann ihn nur wieder zu Stahl und Titan einschmelzen.
ff-damaged-container=Beim Entladen beschädigt. Für ein Viertel der Materialien reparieren oder recyceln.
ff-freight-consignment=Waren von fünf Welten, versiegelt für eine hundertjährige Reise. Der Leichtcontainer wird Teil der Abschirmung der Ladung und fliegt mit ihr zu anderen Sternen. Die Lange Karawane nimmt sie am Rand des Sonnensystems auf.
battery=Enthält aufgeladen 4 MJ.
ff-battery-pack=Enthält aufgeladen 10 MJ.
landfill=Kann in flachem Wasser platziert werden, um Gelände zu erstellen, auf dem du bauen kannst.
bbr-rail-common=Kann nicht in tiefem Wasser platziert werden.

