[tips-and-tricks-item-description]
ff-ext-dry-dock=Baue ein [entity=ff-dry-dock] am Ufer neben einem Hafen: Schiffe, die innerhalb von 16 Feldern stillstehen, werden mit seinen Reparaturpaketen repariert. Um ein Schiff ohne Entladen aufzuwerten, lege das neue Schiff ins Dock und wähle es in der Leiste: Das nächste haltende Schiff wird getauscht, samt Fracht, Brennstoff und Fahrplan.
ff-rocket-silo=Raketensilos können nur auf natürlichen Raketensilo-Gruben gebaut werden.\nDu musst mehrere [item=satellite] starten, um den [item=ff-interstellar-communicator] zu erforschen, der zum Sieg nötig ist.
ff-dredging=Baggerplattformen werden über Unterwasserbergen gebaut.\nDas Baggern von [item=ff-ferrous-nodule] und [item=ff-cupric-nodule] liefert unbegrenzt [item=iron-ore], [item=copper-ore] und [item=stone] zusätzlich zum normalen Abbau.\nDas Baggern von [item=ff-cobalt-crust] liefert unbegrenzt [item=ff-cobalt-ore], das es sonst nirgends gibt.\nKnollen und Krusten haben kleine Stapelgrößen und lassen sich nicht in Container verpacken, daher sollten sie direkt auf der Baggerplattform zu Erz verarbeitet werden.\n\nUnterirdische Förderbänder können auf Baggerplattformen nicht gebaut werden.
ff-fuel=Manche Fahrzeuge brauchen besonderen Brennstoff.\n\nAutos, Panzer, Schiffe und Flugzeuge nehmen alle normalen Brennstoffe: [item=wood] [item=coal] [item=solid-fuel] [item=rocket-fuel] [item=nuclear-fuel]\n[entity=mini-locomotive] nimmt nur einfache Brennstoffe: [item=wood] [item=coal] [item=solid-fuel]\n[entity=locomotive] nimmt nur Batterien: [item=ff-charged-battery] [item=ff-charged-battery-pack] und gibt leere Batterien aus, die entnommen und neu geladen werden müssen. Beim Laden können Batterien mit geringer Wahrscheinlichkeit kaputtgehen.
ff-power=Strom lässt sich nicht mit Strommasten über Ozeane leiten. Baue stattdessen auf jeder Insel eigene Kraftwerke oder speichere Strom in [item=ff-charged-battery] mit einer [entity=ff-charging-station] und transportiere sie per Schiff oder Flugzeug.
ff-oil=Öl gibt es nur in Offshore-Ölvorkommen. Jedes Tankschiff kann mit bis zu drei [entity=pump] beladen werden. Halte eine Pumpe in der Hand, um die gültigen Positionen zu sehen.\nDirekt von der Ölplattform ins Tankschiff zu pumpen ist viel schneller als über Unterwasserrohre.
ff-water-types=Es gibt drei Arten von Wasser: Flachwasser, normales und tiefes Wasser.\n\nSpieler, Fahrzeuge und Aliens können Flachwasser durchqueren. Flachwasser lässt sich mit [item=waterfill-item] erzeugen.\nAufschüttung und Eisenbahnbrücken können nur auf Flach- oder normalem Wasser gebaut werden. Aufschüttung lässt sich mit __ALT_CONTROL__2__mine__ und einer Bodenplatte in der Hand entfernen.\nTiefes Wasser enthält Offshore-Öl und Unterwasserberge und kann nur von Schiffen, Hovercrafts und Flugzeugen befahren werden.
ff-container-limits=Container können nicht von Robotern getragen werden. Es gibt Wege, das zu umgehen, aber sie sollten nicht genutzt werden und könnten in künftigen Updates entfernt werden.\n\nSpidertrons und Flugzeuge können leere Container tragen, aber keine beladenen.
ff-containerization=Container sind eine neue Art, Gegenstände zu transportieren.\nGegenstände werden in einer [entity=ic-containerization-machine-1] in Container verpackt. Jeder Container fasst 20 Stapel des Gegenstands. Züge und Schiffe haben sehr kleine Laderäume, daher ist das Verpacken vor dem Transport unerlässlich. Lässt sich ein Gegenstand nicht verpacken, ist das ein Hinweis, ihn vor Ort weiterzuverarbeiten, statt ihn mit Zügen und Schiffen zu befördern.
freight-forwarding=Willkommen bei Freight Forwarding!\n\nUm das Spiel zu gewinnen, musst du einen [item=ff-interstellar-communicator] ins All schießen.\n\nScreenshots und Videos folgen in einem künftigen Update.
ff-vanilla=Diese Gruppe enthält alle Tipps und Tricks ohne Mods.
ff-ext-cargo-sensor=Stelle einen [entity=ff-cargo-sensor] neben einen Bahnhof oder Hafen: Er zeigt den Inhalt der Container des haltenden Zugs oder Schiffs bereits ausgepackt, Tankcontainer als Flüssigkeiten, dazu [virtual-signal=ff-cargo-containers] Container, [virtual-signal=ff-cargo-fill] % belegte Plätze und [virtual-signal=ff-cargo-vehicles]. Nützlich für Wartebedingungen und zum Ausgleichen von Häfen.
ff-ext-routes-panel=Der Routen-Knopf in der Schnellleiste öffnet eine Liste aller Züge und Schiffe: Zustand, Bahnhof, Dauer, Füllung und Hauptfracht. Festsitzende Fahrzeuge stehen rot ganz oben.
ff-ext-tank-containers=Ein [item=ff-tank-container] fasst 2000 Einheiten Flüssigkeit. Befüllt und geleert in der Chemiefabrik; Schiffe, Züge und Raketen befördern ihn wie jeden Container.
ff-ext-subsea-pipeline=Baue zwei [entity=ff-pipeline-landing] an gegenüberliegenden Ufern, auf einer Linie und einander zugewandt (bis 255 Felder). Öffne eine und verlege die Pipeline: Sie braucht [item=ff-pipeline-segment] (1 pro Feld, 4 für die große Kanalstation), 2 Felder pro Sekunde.
ff-ext-subsea-cable=Baue an jedem Ufer eine [entity=ff-cable-landing], öffne eine und wähle das Ziel. Es braucht Unterseekabel (Sumpfkabel auf Gleba) und Zeit; danach verbindet ein Draht die Stationen.
ff-ext-sea-power=Der [entity=ff-port-crane] belädt Schiffe vom Kai aus mit großer Reichweite. Offshore-Windräder und Gezeitenkraftwerke liefern Strom auf dem Wasser; das Kabelterminal reicht weit übers Meer, aber nur zu anderen Terminals.
ff-ext-insurance=Wird ein Güterwagen, Schiff, Boot oder Spidertron zerstört, erhält das nächste [entity=ff-insurance-office] einen Teil der Ladung (Karteneinstellung, standardmäßig 50 %).
ff-ext-exchange=Lege Container mit Grundgütern in die [entity=ff-caravan-exchange] und wähle, was du erhältst: Alle 10 Sekunden wird zum aktuellen Kurs abzüglich Gebühr getauscht. Die Kurse ändern sich alle 10 Minuten.
ff-ext-great-caravan=Alle paar Stunden kommt die Große Karawane zu den Angeboten: ein riesiger Vertrag mit langer Frist und einzigartiger dauerhafter Belohnung, +3 Ansehen. Ansehen 2, 4 und 6 bringt Baupläne: billigerer Container, billigere Frachtsendung, halbierte Börsengebühr.
ff-sa-permits=Manche Schlüsseltechnologien brauchen zuerst eine Genehmigung. Sie lässt sich nicht im Labor erforschen: Sobald sie verfügbar ist, erscheint nahe dem erkundeten Gebiet des Planeten ein beschädigter Forschungsposten (Kartenmarkierung und Nachricht). Liefere das darüber angezeigte Reparaturmaterial, um ihn wiederherzustellen, dann den verlangten Container: Er wird verbraucht, eine Frachtkapsel startet mit den Aufzeichnungen, und die Schlüsseltechnologie kann normal erforscht werden. 5 Minuten später zerstört sich der Posten selbst.
ff-sa-freight-contract=Die Lange Karawane, interstellare Frachter auf einer jahrhundertelangen Route, kann es sich nicht leisten zu bremsen. Am Rand des Sonnensystems nimmt sie Fracht im Vorbeiflug von wartenden Plattformen auf. Packe [item=ff-freight-consignment] aus Waren aller Planeten, bringe sie zu einer Plattform am Rand und lagere sie in ihrem Hub. Sendungen fliegen für immer mit der Karawane davon, Leichtcontainer eingeschlossen. Wähle einen von drei Verträgen im Vertragsfenster (Schaltfläche in der Schnellzugriffsleiste): Jedes Schiff will eine andere Menge und zahlt anders (Roboter, Bergbau, Forschung, Greifarme, Handfertigung). Den Rand nur zu erreichen ist noch kein Sieg.
ff-sa-hot-titansteel=Heißer Titanstahl muss innerhalb von 2 Minuten gekühlt werden. Sonst verformt er sich, und die Gießerei kann ihn nur wieder zu Stahl und Titan einschmelzen.
ff-sa-spoilage-sensor=Platziere einen [item=ff-spoilage-sensor] innerhalb von 4 Feldern eines Bahnhofs. Er gibt das Verderben der Ladung des haltenden Zuges in Prozent aus, für Wartebedingungen per Signal.
ff-sa-fluorine-seeps=Fluorquellen am Grund des Ammoniakozeans von Aquilo werden von der Bohrinsel gefördert.
ff-sa-icebreaker=Auf Aquilo verwandelt der [item=ff-icebreaker] das Eis um sich in Treibeis, sodass Wasserwege weiter ins Eis gebaut werden können.
ff-sa-swamp-barges=In den Sümpfen von Gleba fahren Schiffe viel langsamer. Der flachbodige [item=ff-swamp-barge] behält die volle Geschwindigkeit.
ff-sa-lava-barges=Auf Vulcanus können Wasserwege auf Lava gebaut werden. Normale Schiffe verbrennen dort; der [item=ff-lava-barge] ist hitzegeschützt.
ff-sa-bridges=Schienenstützen können nicht in tiefem Wasser stehen, daher überbrücken Hochbahnen nur flache Meerengen. Die offene See braucht weiterhin Schiffe.
ff-sa-dredgers=Nassbagger arbeiten auch auf anderen Planeten: Kobaltschlote in der Lava von Vulcanus, Schrott-Tiefseeberge im tiefen Ölozean von Fulgora. Nassbagger Mk2 (Vulcanus) und Mk3 (Aquilo) sind größer und schneller, nehmen Module (ohne Produktivität) und legen größere Plattformen. Plattformen werden nicht über Wasserwege, Schienen oder Züge gelegt.
ff-sa-damaged-containers=Beim Entladen kommen 2 % der Container beschädigt zurück, 1 % geht verloren. Repariere sie von Hand für ein Viertel der Materialien oder wirf sie in einen Recycler.
ff-sa-container-tiers=Container gibt es in vier Stufen: [item=ic-container] normal, [item=ff-reefer-container] Kühlcontainer (Gleba, 5-mal langsameres Verderben), [item=ff-light-container] Leichtcontainer (Vulcanus, festes Gewicht in Raketen) und [item=ff-cryo-container] Kryocontainer (Aquilo, 20-mal langsameres Verderben). Jeder hat eigene Lade- und Entladetabs. Ein verdorbener Container enthält das, wozu sein Inhalt verdirbt.
ff-sa-planet-chains=Jeder Planet stellt her, was nur er kann: Titan und Blei auf Nauvis, Kobalt und Titanstahl auf Vulcanus, Kobalt-Holmium-Batteriepacks auf Fulgora, Kühlcontainer auf Gleba, Lithiumpacks und Frachtwissenschaft auf Aquilo. Batterien können überall geladen werden.
ff-sa-rocket-tiers=Das erste [item=ff-light-rocket-silo] hebt 500 kg und muss auf Nauvis genau in einem Krater gebaut werden. Das normale [item=rocket-silo] (1 t) wird mit der Wissenschaft des ersten besuchten Planeten freigeschaltet und nur dort hergestellt; es kann überall gebaut werden. Das [item=ff-heavy-rocket-silo] (2 t) kommt von Aquilo.

