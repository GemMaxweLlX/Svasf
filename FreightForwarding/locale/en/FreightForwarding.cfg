[tips-and-tricks-item-description]
ff-ext-dredger-planner=Take the dredger planner from the shortcut bar and drag over the sea: a ghost of a dredging platform is placed on every charted seamount or vent where one fits (alt-select: the best dredger researched). It only plans; robots or you build from real items. Uncharted seamounts are skipped: scan the sea first.
ff-ext-dry-dock=Build a [entity=ff-dry-dock] on the shore next to a port: ships standing still within 16 tiles are repaired with repair packs from it. To upgrade a ship without unloading, put the new ship (e.g. [item=ff-fast-cargo-ship]) in the dock and choose it in the panel: the next ship that stops is swapped, cargo, fuel and schedule included.
ff-ext-cargo-sensor=Place a [entity=ff-cargo-sensor] next to a train stop or port: it outputs what the containers in the stopped train or ship hold, already unpacked (10 iron plate containers read as the plates inside), tank containers as fluids, plus [virtual-signal=ff-cargo-containers] containers, [virtual-signal=ff-cargo-fill] % of slots used and [virtual-signal=ff-cargo-vehicles]. Use it in wait conditions and to balance ports.
ff-ext-routes-panel=The routes button on the shortcut bar opens a list of all your trains and ships: state, station, how long they have been there, how full they are and their main cargo. Stuck vehicles (no path, no schedule, full destination) are shown first in red. Click the map link to find one.
ff-ext-tank-containers=A [item=ff-tank-container] carries 2000 units of a fluid. Fill and empty it in a chemical plant; ships, trains and rockets carry it like any container, no tankers or barrels needed.
ff-ext-subsea-pipeline=Build two [entity=ff-pipeline-landing] on opposite shores, on one line and facing each other (up to 255 tiles). Open one and lay the pipeline: it takes [item=ff-pipeline-segment] (1 per tile, 4 for the big duct landing) and 2 tiles per second. Removing a landing breaks the pipeline.
ff-ext-subsea-cable=Build a [entity=ff-cable-landing] on each shore, open one and choose where the cable goes. It takes subsea cable (swamp cable on Gleba) and time; when laid, the landings are joined by a wire that carries power both ways.
ff-ext-sea-power=The [entity=ff-port-crane] loads ships from the quay with a long reach. Offshore wind turbines and tidal generators give power on water; the cable terminal reaches far across the sea, but only to other terminals.
ff-ext-insurance=When a cargo wagon, ship, boat or spidertron is destroyed, the nearest [entity=ff-insurance-office] on the same planet receives part of its cargo (map setting, 50% by default). Keep space in the office.
ff-ext-exchange=Put containers of basic goods into a [entity=ff-caravan-exchange] and choose what to receive in the panel next to it: every 10 seconds they are exchanged at the current price, minus a fee. Prices change every 10 minutes; the arrows show the trend. Buy what your island lacks when it is cheap.
ff-ext-great-caravan=Every few hours the Great Caravan joins the contract offers: a giant contract with a long deadline and a unique permanent reward, +3 reputation. Reputation 2, 4 and 6 bring caravan blueprints: a cheaper container, a cheaper freight consignment and a halved exchange fee.
ff-sa-permits=Some key technologies need a permit first. It can't be researched in labs: when it becomes available, a damaged research post appears near the explored area of the planet (map tag and chat message). Deliver the repair materials shown above it to restore it, then the container it asks for: the container is used up, a cargo pod takes off with the records, and the key technology can be researched as usual. 5 minutes later the post blows itself up.
ff-sa-rocket-tiers=The first [item=ff-light-rocket-silo] lifts 500 kg and on Nauvis must be built exactly in a crater. The normal [item=rocket-silo] (1 t) is unlocked with the science of the first planet you visit and is only crafted there; it can be built anywhere. The [item=ff-heavy-rocket-silo] (2 t) comes from Aquilo.
ff-sa-planet-chains=Every planet makes something only it can: titanium and lead on Nauvis, cobalt and titansteel on Vulcanus, cobalt-holmium battery packs on Fulgora, refrigerated containers on Gleba, lithium battery packs and freight science on Aquilo. Batteries can be charged anywhere.
ff-sa-container-tiers=Containers come in four tiers: [item=ic-container] normal, [item=ff-reefer-container] refrigerated (Gleba, spoilage 5x slower), [item=ff-light-container] light (Vulcanus, fixed weight in rockets) and [item=ff-cryo-container] cryo (Aquilo, spoilage 20x slower). Each has its own packing and unpacking tab. A spoiled container holds what its contents spoil into.
ff-sa-damaged-containers=When unloading, 2% of containers come back damaged and 1% are lost. Repair them by hand for a quarter of their materials, or throw them into a recycler.
ff-sa-dredgers=Dredgers work on other planets too: cobalt vents in the lava of Vulcanus, scrap seamounts on the deep oil ocean of Fulgora. Dredger Mk2 (Vulcanus) and Mk3 (Aquilo) are bigger and faster, take modules (no productivity) and lay bigger platforms. Platforms are not laid over waterways, rails or trains.
ff-sa-bridges=Rail supports can't stand in deep water, so elevated rails only bridge shallow straits. The open ocean still needs ships.
ff-sa-lava-barges=On Vulcanus waterways can be built on lava. Ordinary ships burn there; [item=ff-lava-barge] is heat-shielded.
ff-sa-swamp-barges=In the wetlands of Gleba ships go much slower. The flat-bottomed [item=ff-swamp-barge] keeps its full speed.
ff-sa-icebreaker=On Aquilo the [item=ff-icebreaker] turns the ice around it into brash ice, so waterways can be built further into the ice.
ff-sa-fluorine-seeps=Fluorine seeps on the floor of the ammoniacal ocean of Aquilo are pumped by the oil rig.
ff-sa-spoilage-sensor=Place a [item=ff-spoilage-sensor] within 4 tiles of a train stop. It outputs the spoilage of the stopped train's cargo in percent, for circuit wait conditions.
ff-sa-hot-titansteel=Hot titansteel has to be cooled within 2 minutes. Otherwise it deforms, and the foundry can only melt it back into steel and titanium.
ff-sa-freight-contract=The Long Caravan, interstellar haulers on a route centuries long, can't afford to brake. At the solar system edge they take cargo on the fly from waiting platforms. Pack [item=ff-freight-consignment] from goods of every planet, bring them to a platform at the edge and keep them in its hub. Consignments leave with the caravan for good, light containers too. Choose one of three contracts in the contracts panel (shortcut bar button): each caravan ship wants a different amount and pays differently (robots, mining, research, inserters, crafting). Just reaching the edge is not a victory.
ff-vanilla=This group contains all non-modded tips and tricks.
freight-forwarding=Welcome to Freight Forwarding!\n\nYou must launch an [item=ff-interstellar-communicator] into space to win the game.\n\nDemonstration screenshots and videos will be added in a future update.
ff-containerization=Containers are a new way to transport items.\nItems are loaded onto containers in a [entity=ic-containerization-machine-1]. Each container can hold 20 stacks of that item. Trains and ships have extremely low inventory sizes, so containerizing cargo before transport is essential. If an item cannot be containerized, then that is a hint that you should process it where it is rather than loading it onto trains and ships. 
ff-container-limits=Containers cannot be carried by bots. There are some ways to get this to happen, but they shouldn't be used and may get patched out in future updates.\n\nSpidertrons and aircraft can carry empty containers, but not loaded ones.
ff-water-types=There are three types of water: shallow, regular, and deep water.\n\nPlayers, vehicles, and aliens can all traverse shallow water. Shallow water can be created using [item=waterfill-item].\nLandfill and train bridges can only be placed on shallow or regular water. Landfill can be removed by __ALT_CONTROL__2__mine__ on it with a tile in hand.\nDeep water contains offshore oil and seamounts, and can only be traversed by ships, hovercrafts, and aircraft.
ff-oil=Oil can only be obtained from offshore oil deposits. Each tanker ship can be loaded with up to three [entity=pump]. Hold a pump in hand to see the valid placement positions.\nPumping directly from oil rig to tanker ship is much faster than pumping from underwater pipes.
ff-power=There is no way to transfer electricity over oceans using electric poles. Instead, you must set up individual power generation on each island, or store electricity in [item=ff-charged-battery] using a [entity=ff-charging-station], and transport them by ship or aircraft.
ff-fuel=Some vehicles have unique fuel requirements.\n\nCars, tanks, ships and aircraft accept all regular fuel types: [item=wood] [item=coal] [item=solid-fuel] [item=rocket-fuel] [item=nuclear-fuel]\n[entity=mini-locomotive] accepts only basic fuel types: [item=wood] [item=coal] [item=solid-fuel]\n[entity=locomotive] accepts only batteries: [item=ff-charged-battery] [item=ff-charged-battery-pack] and outputs used batteries which must be removed and recharged. Batteries have a small chance of breaking during charging).
ff-dredging=Dredging platforms can be placed over seamounts.\nDredging for [item=ff-ferrous-nodule] and [item=ff-cupric-nodule] allows infinite production of [item=iron-ore], [item=copper-ore], and [item=stone], to supplement regular resource production.\nDredging for [item=ff-cobalt-crust] allows infinite production of [item=ff-cobalt-ore], which doesn't spawn elsewhere.\nNodules and crusts have low stack sizes and cannot be loaded into containers, so processing them into ores on the dredging platform itself is recommended.\n\nUnderground belts cannot be placed on dredging platforms.
ff-rocket-silo=Rocket silos can only be placed on naturally occuring rocket silo holes.\nYou must launch several [item=satellite] in order to research the [item=ff-interstellar-communicator] necessary to win the game.

