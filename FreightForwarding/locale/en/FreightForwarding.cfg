[item-description]
ff-dredger-planner=Drag over the sea to plan dredging platforms on every charted seamount or vent where one fits. Alt-select plans the best dredger you have researched. Only ghosts: robots or you build them.
ff-tank-boiled=Part of the cryogenic fluid has boiled off. Empty it soon: the rest boils off too.
ff-msi-cargo=Mining Space Industries cargo for the Long Caravan, packed in the caravan's intermodal containers. Launched by rocket for an MSI delivery request.
ff-pipeline-segment=A length of pipe laid along the seabed between two pipeline landings.
ff-tank-container=A container for fluids. Filled and emptied in a chemical plant; ships, trains and rockets carry it like any container.
ff-swamp-cable=Cable insulated with spoilage and carbon fiber, laid through the wetlands of Gleba between two cable landings. Made only on Gleba.
ff-subsea-cable=Armoured cable laid along the seabed between two cable landings on Nauvis. One per tile of distance. Made only on Nauvis.
ff-freight-consignment=Goods of five worlds, sealed for a voyage of a hundred years. The light container becomes part of the cargo's shielding and leaves with it for other stars. The Long Caravan takes them at the solar system edge.
ff-damaged-container=Came back damaged from unloading. Repair it for a quarter of its materials, or recycle it.
ff-deformed-titansteel-plate=Hot titansteel that cooled down on its own. The foundry can only melt it back into steel and titanium.
ff-freight-science-pack=Assembled on Aquilo from parts of every planet.
ff-light-container=A full light container always weighs the same, whatever is inside (see its weight). Made on Vulcanus.
ff-cryo-container=Carries spoilable items, which spoil 20 times slower. A full cryo container has a fixed weight. Made on Aquilo.
ff-reefer-container=Carries spoilable items. Contents spoil 5 times slower. Made on Gleba.
ff-light-space-platform-starter-pack=Light enough (500 kg) to be launched by the light rocket silo. Comes with fewer foundation tiles.
battery=Holds 4 MJ when charged.
ff-battery-pack=Holds 10 MJ when charged.
landfill=Can be placed on non-deep water to create terrain you can build on.
bbr-rail-common=Cannot be placed on deep water.
ff-interstellar-communicator=Can be launched in a rocket to win the game.

