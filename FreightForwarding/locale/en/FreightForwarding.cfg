[technology-description]
ff-dredger-mk2=A bigger, faster dredger with module slots.
ff-dredger-mk3=A heavy dredger: the fastest, with 4 module slots.
ff-swamp-barge=Flat-bottomed ships for the wetlands of Gleba, where other ships crawl at a quarter of their speed.
ff-icebreaker=Ships that open channels through the ice of Aquilo.
ff-lava-barge=Heat-shielded ships for the lava lakes of Vulcanus. Waterways can be built on lava; other ships burn there.
ff-locomotive-mk2=Faster and stronger locomotives. Made on Fulgora.
ff-locomotive-mk3=The fastest locomotives. Made on Aquilo.
ff-rolling-stock-mk2=Cargo and fluid wagons with double capacity. Made on Vulcanus.
ff-freight-science-pack=A science pack assembled on Aquilo from transport science, titansteel, a charged battery pack, a refrigerated container and lithium. Needed by all technologies that use cryogenic science.
ff-fast-cargo-ship=Cargo ships 1.5 times faster.
ff-heavy-cargo-ship=Cargo ships with a double hold.
ff-light-containers=Tungsten containers with a fixed weight of 250 kg when full: much cheaper rocket launches for heavy goods. Made on Vulcanus.
ff-cryo-containers=Containers for spoilable items that spoil 20 times slower, 250 kg when full. Made on Aquilo.
ff-dredging-productivity=+20% productivity of dredging nodules and cobalt crust.
ff-fast-charging=Charging stations that work 3 times faster. Made on Fulgora.
ff-scanners-mk2=Seismic scanners and sonar buoys with twice the range. Made on Aquilo.
ff-refrigerated-containers=Containers for spoilable items, made on Gleba. Contents spoil __1__ times slower.
ff-lithium-battery-pack=The best battery fuel: 25 MJ, faster acceleration and top speed, and it does not lose its charge. Made on Aquilo.
ff-heavy-rocket-silo=Rocket silos lifting 2000 kg. Their rocket parts are built from titansteel rocket frames.
ff-heavy-lift-rockets=Full-size rocket silos (1000 kg) that can be built anywhere, cargo landing pads and space platform starter packs.\nThere are three versions of this technology, one for each of Vulcanus, Fulgora and Gleba: researching any of them completes the others.\nEach of these planets has its own rocket silo recipe from local materials, craftable only there.
ff-light-rocket-silo=Light rocket silos (500 kg) that can only be built in rocket silo holes on Nauvis, small landing pads and light space platform starter packs.
ff-transport-science-pack=Allows research of intercontinental logistics and oil processing.
ff-seismic-scanner=Underground scans can travel further than a radar, but only through connected landmasses.
ff-sonar-buoy=Scans large areas of water. Sonar pings can travel a lot further than radar or seismic scans, but are blocked by landmasses.
ff-dredging=Recover polymetallic nodules from seamounts and process them into infinite resources.
ff-advanced-railway=Battery-powered trains that can travel much further, with more cargo.
ff-battery-charging=Transport electricity using charged batteries.
ff-battery-pack=Denser and more reliable mobile electricity storage.
ff-cobalt-processing=Discover cobalt crust on seamounts, useful for advanced battery technology and as an infinite source of lead and titanium.
ff-titansteel-processing=Smelt titansteel in naturally occurring lava pools. The cooling process gives off steam which can be turned into electricity.
landfill=Can be placed on non-deep water to create terrain you can build on.
lex-flying-cargo-ships=A long-range flying aircraft without weapons, useful for remotely constructing outposts on other islands.
ff-rocket-silo=Allows you to launch a rocket into space.\nRocket silos can only be placed on naturally occuring rocket silo holes.
ff-interstellar-communication=Allows you to launch an interstellar communicator into space and win the game.

