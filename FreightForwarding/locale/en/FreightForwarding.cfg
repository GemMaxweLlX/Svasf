[mod-setting-description]
ff-living-reefers=Reefers carried in trains and ships need feed — [item=bioflux] (keeps for hours) or [item=nutrients]: 1 per reefer every 10 minutes, taken from the same hold. Without nutrients a reefer slows spoilage only 2 times instead of 5.
ff-contract-great-period=How often the Great Caravan comes with a giant contract and a unique reward.
ff-insurance-payout=Share of every stack of a destroyed vehicle's cargo that goes into the nearest insurance office.
ff-delivery-permits=An exclusive mechanic of FF + Space Age: key technologies first need a permit, granted by delivering a container to a research post that appears near the explored area of a planet.
ff-contract-offer-lifetime=An offer not accepted in this time (±25%) disappears.
ff-contract-refresh=All offers are replaced by new ones this often.
ff-contract-deadline=Time to fulfil a contract of the base size after accepting it; bigger contracts get proportionally more.
ff-contract-penalty=After the deadline, every 10 minutes the contract grows by this share of its size, until it is fulfilled.
ff-freight-contract-size=How many freight consignments have to be delivered to the solar system edge to win.
ff-light-container-weight=Fixed weight of a full light or cryo container in a rocket. 1000 kg = no gain over loose items.
ff-fluorine-seep-yield=Yield of fluorine seeps on Aquilo, in % of a normal oil field.
ff-scrap-dredging-amount=How much scrap a dredger gets from a scrap seamount per cycle (50 s at speed 1).
ff-dredger-productivity-modules=Seamounts never run out, so productivity modules make dredging very strong.
ff-swamp-ship-speed=Speed limit of ships (except swamp barges) in the wetlands of Gleba, as a share of their top speed.
ff-heavy-ship-speed=Speed of the heavy cargo ship (2x hold) as a share of the normal cargo ship.
ff-wagon-mk2-capacity=Cargo and fluid wagon Mk2 capacity compared to the normal wagons.
ff-transport-science-planet-techs=If off, technologies that need another planet's science don't need transport science.
ff-classic-mode=Freight Forwarding exactly as in 1.x, even with Space Age: lava pools, cobalt and titansteel on Nauvis, one rocket silo type that needs a rocket silo hole on Nauvis, rocket parts with titansteel frames and battery packs. Other planets are left as in Space Age. Off: extended mode, with the Space Age features of this mod.
ff-island-terrain-by-default=Use the Freight Forwarding island terrain for Nauvis even when the "Freight Forwarding" map preset is not selected (e.g. Default preset, or a Space Age game).
ff-revert-locomotive-fuel-category=Allows locomotives to use burnable fuel rather than just being battery powered. Enable if upgrading from a previous version of Freight Forwarding and you don't want to have to redo your train fueling.\nThis setting may be removed in future updates.

