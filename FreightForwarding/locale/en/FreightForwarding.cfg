great_labs=A flying academy. A giant contract, a long deadline, and a reward kept forever.
msi=A Mining Space Industries ship travelling with the caravan. Pays with research data and the location of another wreck holding a lost technology.
observatory=A deep-space observatory. Pays with centuries of observations.
forge=A forge ship that mines whole asteroids. Pays with its extraction secrets.
flagship=The caravan's flagship. Trusts only proven partners; pays with its own drone fleet designs.
navigation=A pathfinder of the caravan. Pays with routing algorithms gathered over centuries.
survey=Has surveyed thousands of asteroids and moons. Pays with prospecting data.
archive=Carries the research archives of a dozen worlds. Pays with copies.
cargo=A huge freighter. Pays with its loading machinery designs.
drones=A carrier of cargo drones. Pays with drone frames that lift more.
workshop=A floating workshop with quick hands. Wants less, pays with its crafting tricks.

