[entity-description]
ff-dredger-mk2=A bigger dredger: twice as fast, 2 module slots. Build it on a seamount.
ff-dredger-mk3=A heavy dredger: three times as fast, 4 module slots. Build it on a seamount.
ff-scrap-seamount=Wreckage piled up on the floor of the deep oil ocean. Build a dredger on it.
ff-fluorine-seep=Fluorine bubbling up from the floor of the ammoniacal ocean. Build an oil rig on it.
ff-swamp-barge=Flat-bottomed: the only ship that doesn't crawl through the wetlands of Gleba.
ff-icebreaker=Breaks the ice around it into brash ice, so waterways can be built further. Small hold.
ff-spoilage-sensor=Place within 4 tiles of a train stop. Outputs how spoiled the stopped train's cargo is, in percent (most spoiled stack and average). Use it in a circuit wait condition.
ff-lava-barge=A heat-shielded cargo ship. Other ships burn on lava.
ff-locomotive-mk2=Superconducting motors: 1.25 times faster, 1.6 times more power.
ff-locomotive-mk3=Lithium drive: 1.5 times faster, 2.2 times more power.
ff-cargo-wagon-mk2=Tungsten frame: twice the capacity.
ff-fluid-wagon-mk2=Tungsten tank: twice the capacity.
ff-fast-cargo-ship=A cargo ship with tungsten-carbide engines: 1.5 times faster.
ff-heavy-cargo-ship=A cargo ship with a double hold, a bit slower.
ff-fuel-depot=Place within 10 tiles of a train stop or port. Stopped trains and ships refuel from it and drop their burnt fuel (empty batteries) into it.
ff-fast-charging-station=Charges batteries 3 times faster.
ff-cobalt-vent=Cobalt-rich crust forming in a lava lake. Build a dredging platform on it to mine cobalt crust.
ff-heavy-rocket-silo=Rockets lift 2000 kg. Rocket parts need titansteel rocket frames, smelted only in the lava pools of Vulcanus. Can be built anywhere.
ff-light-rocket-silo=A cheaper rocket silo for the first trips to space. Rockets lift only 500 kg and need 20 rocket parts.\nOn Nauvis it can only be built exactly on a rocket silo hole; on other planets anywhere.
ff-small-cargo-landing-pad=A cheaper landing pad with only 20 inventory slots. Can be upgraded in place to a cargo landing pad.
ff-seismic-scanner=Scans connected landmasses, outputting significant pollution. Cannot be placed within 16 tiles of water.
ff-sonar-buoy=Scans large areas of water. Gets blocked by landmasses.
ff-seamount=Underwater mountain which can be dredged for infinite polymetallic nodules.
ff-rocket-silo=Used to craft and launch a rocket for receiving scientific data from space.\nCan only be placed on naturally occuring rocket silo holes.

