[entity-description]
ff-lava-barge-mk2=A heat-shielded barge with twice the hold of a cargo ship, but slower than the first lava barge.
ff-dry-dock=Repairs ships standing still within 16 tiles with repair packs from its inventory, and swaps a ship to another type without unloading: put the new ship in the dock and choose it in the panel. Cargo, fuel and schedule move over; the old ship goes into the dock.
ff-caravan-exchange=A trading post of the caravan. Put in containers of basic goods (ores, plates, coal, stone, wood...) and choose what to receive: every 10 seconds they are exchanged at the current prices, minus a fee. Prices change every 10 minutes.
ff-cargo-sensor=Place next to a train stop or port. Shows what the containers in the stopped train or ship hold, unpacked (tank containers as fluids), plus the number of containers [virtual-signal=ff-cargo-containers], how full the cargo slots are in % [virtual-signal=ff-cargo-fill] and [virtual-signal=ff-cargo-vehicles] = 1 while something is stopped.
ff-insurance-office=When a cargo wagon, ship, boat or spidertron is destroyed, part of its cargo is paid out into the nearest insurance office on the same planet. What does not fit is lost.
ff-pipeline-landing=One end of a subsea pipeline. Build two landings facing each other on one line, up to __1__ tiles apart, then open one to lay the pipeline along the seabed (__2__ segment(s) per tile).
ff-research-post=A station left by the first expedition of the Long Caravan, found damaged. Deliver the repair materials it shows to restore it, then the containers it asks for: it sends its records off in a cargo pod and grants a permit to research a key technology. 5 minutes later it blows itself up.
ff-cable-landing=Both ends of a cable laid along the seabed (Nauvis) or through the wetlands (Gleba). Build one on each shore, open one and choose where the cable goes: it shows the distance, the cable needed (1 per tile, each planet its own) and the laying time. When laid, it works like a normal wire, both ways.
ff-port-crane=A bulk inserter with a long reach (3 tiles) and a big hand, for loading ships from the quay and back.
ff-cable-terminal=Its wires reach 64 tiles, but only to other cable terminals: power across the sea to other islands. Tiny supply area.
ff-offshore-wind-turbine=Built on water. Up to 1 MW, depending on the wind, which changes slowly.
ff-tidal-generator=Built on shallow water. Up to 600 kW, following the tide (a 20 minute cycle).
ff-dredger-mk2=A bigger dredger: twice as fast, 2 module slots. Build it on a seamount.
ff-dredger-mk3=A heavy dredger: three times as fast, 4 module slots. Build it on a seamount.
ff-scrap-seamount=Wreckage piled up on the floor of the deep oil ocean. Build a dredger on it.
ff-fluorine-seep=Fluorine bubbling up from the floor of the ammoniacal ocean. Build an oil rig on it.
ff-swamp-barge=Flat-bottomed: the only ship that doesn't crawl through the wetlands of Gleba.
ff-icebreaker=Breaks the ice around it into brash ice, so waterways can be built further. Small hold.
ff-spoilage-sensor=Place within 4 tiles of a train stop. Outputs how spoiled the stopped train's cargo is, in percent (most spoiled stack and average). Use it in a circuit wait condition.
ff-lava-barge=A heat-shielded cargo ship. Other ships burn on lava.
ff-locomotive-mk2=Superconducting motors: 1.25 times faster, 1.6 times more power.
ff-locomotive-mk3=Lithium drive: 1.5 times faster, 2.2 times more power.
ff-cargo-wagon-mk2=Tungsten frame: 1.5 times the capacity (setting).
ff-fluid-wagon-mk2=Tungsten tank: 1.5 times the capacity (setting).
ff-fast-cargo-ship=A cargo ship with tungsten-carbide engines: 1.5 times faster.
ff-heavy-cargo-ship=A cargo ship with a double hold, but slower.
ff-fuel-depot=Place within 10 tiles of a train stop or port. Stopped trains and ships refuel from it and drop their burnt fuel (empty batteries) into it.
ff-fast-charging-station=Charges batteries 3 times faster.
ff-cobalt-vent=Cobalt-rich crust forming in a lava lake. Build a dredging platform on it to mine cobalt crust.
ff-heavy-rocket-silo=Rockets lift 2000 kg. Rocket parts need titansteel rocket frames, smelted only in the lava pools of Vulcanus. Can be built anywhere.
ff-light-rocket-silo=A cheaper rocket silo for the first trips to space. Rockets lift only 500 kg and need 20 rocket parts.\nOn Nauvis it can only be built exactly on a rocket silo hole; on other planets anywhere.
ff-small-cargo-landing-pad=A cheaper landing pad with only 20 inventory slots. Can be upgraded in place to a cargo landing pad.
ff-seismic-scanner=Scans connected landmasses, outputting significant pollution. Cannot be placed within 16 tiles of water.
ff-sonar-buoy=Scans large areas of water. Gets blocked by landmasses.
ff-seamount=Underwater mountain which can be dredged for infinite polymetallic nodules.
ff-rocket-silo=Used to craft and launch a rocket for receiving scientific data from space.\nCan only be placed on naturally occuring rocket silo holes.

