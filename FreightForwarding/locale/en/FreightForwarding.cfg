ff-deformed-titansteel-plate=Hot titansteel that cooled down on its own. The foundry can only melt it back into steel and titanium.
ff-freight-science-pack=Assembled on Aquilo from parts of every planet.
ff-light-container=A full light container always weighs 250 kg, whatever is inside: 4 fit in a rocket. Made on Vulcanus.
ff-cryo-container=Carries spoilable items, which spoil 20 times slower. A full cryo container weighs 250 kg. Made on Aquilo.
ff-reefer-container=Carries spoilable items. Contents spoil 5 times slower. Made on Gleba.
ff-light-space-platform-starter-pack=Light enough (500 kg) to be launched by the light rocket silo. Comes with fewer foundation tiles.
battery=Holds 4 MJ when charged.
ff-battery-pack=Holds 10 MJ when charged.
landfill=Can be placed on non-deep water to create terrain you can build on.
bbr-rail-common=Cannot be placed on deep water.
ff-interstellar-communicator=Can be launched in a rocket to win the game.

