[entity-description]
ff-insurance-office=Коли знищено вантажний вагон, корабель, човен чи павука, частина вантажу виплачується в найближчу страхову контору на тій самій планеті. Що не вмістилося — втрачається.
ff-pipeline-landing=Кінець підводного трубопроводу. Поставте два вузли один навпроти одного на одній лінії, до __1__ клітинок, потім відкрийте один і прокладіть трубу по дну (__2__ сегм. на клітинку).
ff-research-post=Станція, залишена першою експедицією Далекого каравану; знайдена пошкодженою. Доставте матеріали для ремонту, вказані над нею, щоб відновити її, потім контейнери, які вона просить: вона відправить свої записи вантажною капсулою й видасть допуск до дослідження ключової технології. За 5 хвилин вона самознищується.
ff-cable-landing=Обидва кінці кабелю, прокладеного дном (Нувіс) або болотами (Глеба). Поставте по одній на кожному березі, відкрийте одну й виберіть, куди піде кабель: видно відстань, скільки потрібно кабелю (1 на клітинку, у кожної планети свій) і час прокладання. Після прокладання працює як звичайний дріт, в обидва боки.
ff-sonar-buoy=Сканує великі ділянки води. Суходіл блокує сигнал.
ff-small-cargo-landing-pad=Дешевший посадковий майданчик лише з 20 слотами. Можна покращити на місці до звичайного.
ff-light-rocket-silo=Дешевша ракетна шахта для перших польотів у космос. Ракети піднімають лише 500 кг і потребують 20 частин.\nНа Нувісі ставиться лише точно в котлован; на інших планетах — будь-де.
ff-heavy-rocket-silo=Ракети піднімають 2000 кг. Частини ракет потребують рам з титаносталі, яку виплавляють лише в лавових басейнах Вулкануса. Ставиться будь-де.
ff-cobalt-vent=Багата на кобальт кірка в лавовому озері. Поставте на неї земснаряд, щоб добувати кобальтову кірку.
ff-fast-charging-station=Заряджає батареї втричі швидше.
ff-fuel-depot=Поставте в межах 10 клітинок від станції або порту. Поїзди й кораблі, що стоять, заправляються з нього й скидають відпрацьоване паливо (розряджені батареї).
ff-heavy-cargo-ship=Вантажний корабель з подвійним трюмом, але повільніший.
ff-fast-cargo-ship=Вантажний корабель із двигунами з карбіду вольфраму: у 1,5 раза швидший.
ff-fluid-wagon-mk2=Вольфрамовий бак: об'єм у 1,5 раза більший (налаштування).
ff-cargo-wagon-mk2=Вольфрамова рама: місткість у 1,5 раза більша (налаштування).
ff-locomotive-mk3=Літієвий привід: у 1,5 раза швидший, у 2,2 раза потужніший.
ff-locomotive-mk2=Надпровідні двигуни: у 1,25 раза швидший, у 1,6 раза потужніший.
ff-lava-barge=Вантажний корабель із тепловим захистом. Інші кораблі на лаві горять.
ff-spoilage-sensor=Поставте в межах 4 клітинок від станції. Видає псування вантажу поїзда, що стоїть, у відсотках (найзіпсованіша стопка та середнє). Використовуйте в умові очікування за сигналом.
ff-icebreaker=Перетворює лід навколо себе на битий лід, по якому можна прокладати водні шляхи далі. Малий трюм.
ff-swamp-barge=Плоскодонна: єдиний корабель, який не повзе болотами Глеби.
ff-fluorine-seep=Фтор, що піднімається з дна аміачного океану. Поставте на нього нафтову вишку.
ff-scrap-seamount=Уламки на дні глибокого нафтового океану. Поставте на неї земснаряд.
ff-dredger-mk3=Важкий земснаряд: утричі швидший, 4 слоти модулів. Ставиться на підводну гору.
ff-dredger-mk2=Більший земснаряд: удвічі швидший, 2 слоти модулів. Ставиться на підводну гору.
ff-tidal-generator=Ставиться на мілководдя. До 600 кВт за припливом (цикл 20 хвилин).
ff-offshore-wind-turbine=Ставиться на воду. До 1 МВт залежно від вітру, який повільно змінюється.
ff-cable-terminal=Його дроти сягають 64 клітинок, але лише до інших кабельних терміналів: електрика через море на інші острови. Дуже мала зона живлення.
ff-port-crane=Груповий маніпулятор з довгою рукою (3 клітинки) і великим захватом — для навантаження кораблів з причалу й назад.
ff-seismic-scanner=Сканує прилеглі ділянки суші, виводячи значне забруднення. Не можна розміщувати в межах 16 тайлів води.
ff-seamount=Підводна гора, яка може бути вирита для нескінченних поліметалевих конкрецій.
ff-rocket-silo=Використовується для виготовлення та запуску ракети для отримання наукових даних із космосу.\nМожна розміщувати лише на природних дір під ракетні шахти.

