[freight-forwarding]
sonar-buoy-warmup=Аналіз ділянки перед початком сканування
rocket-silo-needs-hole=Ракетні шахти на Нувісі можна ставити лише в котлован
migrated-from-1=[Freight Forwarding] Збереження з Freight Forwarding 1.x оновлено до 2.0. Острови, лавові басейни, земснаряди й контейнери збережено; нові ділянки карти генеруються вже за правилами 2.x.
migrated-from-1-space-age=[Freight Forwarding] Увімкнено Space Age: кобальтову кірку тепер драгують лише на Вулканусі, тож земснаряди на Нувісі, що добували кобальт, зупиняться (конкреції з дна й лавові басейни працюватимуть далі). Щоб дограти збереження по-старому, увімкніть стартове налаштування «Класичний режим».
msg-intro=Ласкаво просимо до Експедиції! Ваше завдання - запустити в космос міжзоряний комунікатор. Ознайомтеся з порадами та підказками для отримання додаткової інформації.
warn-nondefault-mapgen=[img=utility/warning_icon] Схоже, що ви не вибрали попередньо встановлену мапу Експедування за замовчуванням.\nЯкщо це сталося ненавмисно, рекомендуємо перезапустити мапу за замовчуванням "[font=heading-1][color=green]__1__[/color][/font]" для отримання бажаного результату.
seismic-scanner-too-close-to-water=Необхідно розмістити більше __1__ плиток від води
containers-in-spider-vehicles=[Експедування вантажів] Навантажені контейнери не можуть бути завантажені в павукотрони або літаки. Спроба на __1__
containers-in-spider-vehicles-by-player=Завантажені контейнери не можуть бути завантажені в павутинні або літальні апарати - продукт розлився
containers-too-heavy=Контейнери занадто важкі для логістичних роботів - запит задоволено

