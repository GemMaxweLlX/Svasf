[ff-contract]
alliance=alliance=Далекий караван тепер ваш союзник: він ретранслюватиме сигнал міжгалактичного приймача-передавача. Мета — приймач-передавач.
victory-message=Перший корабель каравана поніс товари п'яти світів у темряву між зірками. Про ваш завод тепер знають за межами Сонячної системи — і слідом ідуть нові кораблі.
victory-title=Ви в Далекому каравані
pickup=Корабель каравана пройшов край системи й забрав __1__ партій (__2__ / __3__).
signal=Сигнал з-за краю системи: повз проходить Далекий караван і забирає вантаж на льоту. Товари п'яти світів, опечатані на сто років. Виберіть контракт на панелі контрактів (кнопка панелі швидкого доступу) і доставте партії на платформу на краю Сонячної системи.
accepted=Контракт __1__ прийнято: __2__, __3__ × [item=__4__].
new-offers=Підходять нові кораблі каравана: виберіть контракт __1__ на панелі контрактів.
fulfilled-type=Контракт __1__ (__2__) виконано! Корабель завантажено, і він пішов у темряву. Нагорода: __3__.
refreshed=Повз проходять нові кораблі каравана: пропозиції контрактів оновилися.
penalty=Штраф за прострочення: +__1__ партій, тепер за контрактом потрібно __2__.
overdue=Контракт __1__ прострочено! Корабель каравана чекає, але щодесять хвилин вимагає більше.
reputation-up=Здано вчасно: репутація +__1__ (тепер __2__).
reputation-down=Здано із запізненням: репутація −__1__ (тепер __2__). За поганої репутації контракти більші.
rare-unlocked=Караван тепер вам довіряє: рідкісні кораблі пропонуватимуть контракти.

