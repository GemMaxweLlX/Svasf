[item-description]
ff-pipeline-segment=Ділянка труби, що укладається по морському дну між береговими вузлами.
ff-tank-container=Контейнер для рідин. Заповнюється й зливається в хімзаводі; кораблі, поїзди й ракети возять його як будь-який контейнер.
ff-swamp-cable=Кабель з ізоляцією з гнилі та вуглеволокна, що прокладається болотами Глеби між двома кабельними муфтами. Виготовляється лише на Глебі.
ff-subsea-cable=Броньований кабель, що прокладається дном між двома кабельними муфтами на Нувісі. Один на клітинку відстані. Виготовляється лише на Нувісі.
ff-light-space-platform-starter-pack=Досить легкий (500 кг) для легкої ракетної шахти. Менше плит фундаменту.
ff-reefer-container=Перевозить предмети, що псуються. Вміст псується в 5 разів повільніше. Виробляється на Глебі.
ff-cryo-container=Перевозить предмети, що псуються: вони псуються в 20 разів повільніше. Вага повного кріоконтейнера стала. Виробляється на Аквілоні.
ff-light-container=Повний легкий контейнер завжди важить однаково, хоч би що було всередині (див. вагу). Виробляється на Вулканусі.
ff-freight-science-pack=Збирається на Аквілоні з деталей усіх планет.
ff-deformed-titansteel-plate=Гаряча титаносталь, що охолола сама. Ливарня може лише переплавити її назад на сталь і титан.
ff-damaged-container=Пошкодився під час розпакування. Полагодьте його за чверть матеріалів або відправте в переробник.
ff-freight-consignment=Товари п'яти світів, опечатані для польоту завдовжки сто років. Легкий контейнер стає частиною захисної обшивки вантажу й відлітає з ним до інших зірок. Їх забирає Далекий караван на краю Сонячної системи.
battery=Містить 4 МДж у зарядженому стані.
ff-battery-pack=Містить 10 МДж у зарядженому стані.
landfill=Можна ставити на неглибокій воді, щоб створити рельєф, на якому можна будувати.
bbr-rail-common=Не можна ставити на глибоку воду.
ff-interstellar-communicator=Можна запустити в ракету, щоб виграти гру.

