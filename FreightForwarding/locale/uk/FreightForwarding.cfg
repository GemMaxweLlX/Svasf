[tips-and-tricks-item-description]
ff-sa-permits=Деяким ключовим технологіям спершу потрібен допуск. У лабораторії його не дослідити: коли він стає доступним, біля дослідженої частини планети з’являється пошкоджений дослідницький пост (мітка на карті й повідомлення в чаті). Доставте матеріали для ремонту, вказані над ним, щоб відновити його, потім потрібний контейнер: він витрачається, відлітає вантажна капсула із записами, і ключову технологію можна досліджувати як звичайно. За 5 хвилин пост самознищується.
ff-sa-freight-contract=Далекий караван — міжзоряні вантажовози на маршруті завдовжки століття — не може дозволити собі гальмувати. На краю Сонячної системи він забирає вантаж на льоту з платформ, що чекають. Зберіть [item=ff-freight-consignment] з товарів усіх планет, доставте на платформу на краю й тримайте в хабі. Партії відлітають з караваном назавжди, разом з легкими контейнерами. Виберіть один із трьох контрактів на панелі контрактів (кнопка панелі швидкого доступу): кожен корабель каравана просить свою кількість і платить по-своєму (роботи, видобуток, дослідження, маніпулятори, ручне складання). Просто долетіти до краю — ще не перемога.
ff-sa-hot-titansteel=Гарячу титаносталь треба охолодити за 2 хвилини. Інакше вона деформується, і ливарня зможе лише переплавити її назад на сталь і титан.
ff-sa-spoilage-sensor=Поставте [item=ff-spoilage-sensor] в межах 4 клітинок від станції. Він видає псування вантажу поїзда, що стоїть, у відсотках — для умов очікування за сигналом.
ff-sa-fluorine-seeps=Фтористі джерела на дні аміачного океану Аквілона качає нафтова вишка.
ff-sa-icebreaker=На Аквілоні [item=ff-icebreaker] перетворює лід навколо себе на битий лід, і водні шляхи можна прокладати далі в кригу.
ff-sa-swamp-barges=На болотах Глеби кораблі йдуть набагато повільніше. Плоскодонна [item=ff-swamp-barge] — на повній швидкості.
ff-sa-lava-barges=На Вулканусі водні шляхи можна прокладати лавою. Звичайні кораблі там горять, [item=ff-lava-barge] має тепловий захист.
ff-sa-bridges=Опори рейок не можна ставити в глибокій воді, тож надземні рейки проходять лише через мілкі протоки. Через відкритий океан — як і раніше кораблі.
ff-sa-dredgers=Земснаряди працюють і на інших планетах: кобальтові виходи в лаві Вулкануса, підводні гори з брухтом на глибокому нафтовому океані Фульгори. Земснаряди Mk2 (Вулканус) і Mk3 (Аквілон) більші й швидші, приймають модулі (без продуктивності) і кладуть більшу платформу. Платформа не лягає на водні шляхи, рейки й поїзди.
ff-sa-damaged-containers=Під час розпакування 2% контейнерів повертаються пошкодженими, 1% втрачається. Лагодьте їх вручну за чверть матеріалів або відправляйте в переробник.
ff-sa-container-tiers=Контейнери чотирьох рівнів: [item=ic-container] звичайний, [item=ff-reefer-container] рефрижераторний (Глеба, псування ×5 повільніше), [item=ff-light-container] легкий (Вулканус, стала вага в ракеті) і [item=ff-cryo-container] кріо (Аквілон, псування ×20 повільніше). У кожного свої вкладки пакування й розпакування. Зіпсований контейнер містить те, на що псується товар.
ff-sa-planet-chains=Кожна планета робить те, чого не роблять інші: титан і свинець — Нувіс, кобальт і титаносталь — Вулканус, кобальт-гольмієві батарейні блоки — Фульгора, рефрижераторні контейнери — Глеба, літієві блоки та фрахтову науку — Аквілон. Заряджати батареї можна будь-де.
ff-sa-rocket-tiers=Перша [item=ff-light-rocket-silo] піднімає 500 кг і на Нувісі ставиться лише точно в кратер. Звичайна [item=rocket-silo] (1 т) відкривається наукою першої відвіданої планети й виготовляється лише там; ставиться будь-де. [item=ff-heavy-rocket-silo] (2 т) — з Аквілона.
ff-vanilla=Ця група містить усі немодифіковані поради та підказки.
freight-forwarding=Ласкаво просимо до Експедиції вантажів!\n\nДля перемоги у грі необхідно запустити в космос [item=ff-interstellar-communicator].\n\nДемонстраційні скриншот та відео будуть додані в наступному оновленні.
ff-containerization=Контейнери - це новий спосіб транспортування предметів.\nПредмети завантажуються у контейнери за допомогою [entity=ic-containerization-machine-1]. Кожен контейнер може вмістити 20 стопок цього предмета. Потяги та кораблі мають надзвичайно малі розміри запасів, тому контейнеризація вантажу перед транспортуванням є дуже важливою. Якщо предмет не може бути поміщений в контейнер, то це натяк на те, що вам слід обробити його там, де він знаходиться, а не завантажувати на потяги і кораблі.
ff-container-limits=Контейнери не можуть перевозитися ботами. Існує кілька способів зробити це, але їх не слід використовувати, і вони можуть бути виправлені у майбутніх оновленнях.\n\nПавукотрони та літаки можуть перевозити порожні контейнери, але не завантажені.
ff-water-types=Існує три типи води: мілководна, звичайна та глибока.\n\nГравці, транспортні засоби та прибульці можуть пересуватися мілководдям. Мілководдя можна створити за допомогою [item=waterfill-item].\nЗвалище та залізничні мости можна розміщувати лише на мілководді або звичайній воді. Звалище можна видалити за допомогою __ALT_CONTROL__2__mine__ на ньому з тайлом у руці.\nГлибока вода містить офшорну нафту і підводні гори, і може перетинатися лише кораблями, суднами на повітряній подушці та літаками.
ff-oil=Нафта може бути отримана тільки з морських нафтових родовищ. На кожен танкер можна завантажити до трьох [entity=pump]. Потримайте помпу руці, щоб побачити допустимі позиції розміщення.\nПерекачування безпосередньо з нафтової вишки на танкер відбувається набагато швидше, ніж перекачування з підводних труб.
ff-power=Не існує способу передавати електроенергію через океан за допомогою електричних стовпів. Замість цього ви повинні встановити індивідуальне виробництво електроенергії на кожному острові або зберігати електроенергію в [item=ff-charged-battery] за допомогою [entity=ff-charging-station], і транспортувати її кораблем або літаком.
ff-fuel=Деякі транспортні засоби мають унікальні вимоги до палива.\n\nАвтомобілі, цистерни, кораблі та літаки приймають всі звичайні типи палива: [item=wood] [item=coal] [item=solid-fuel] [item=rocket-fuel] [item=nuclear-fuel]\n[entity=mini-locomotive] приймає лише основні типи палива: [item=wood] [item=coal] [item=solid-fuel]\n[entity=locomotive] приймає лише акумулятори: [item=ff-charged-battery] [item=ff-charged-battery-pack] і виводить використані батареї, які потрібно вийняти і зарядити. Батареї мають невеликий шанс зламатися під час заряджання).
ff-dredging=Землечерпальні платформи можна розмістити над підводними горами.\nРозробка [item=ff- ferrous-nodule] і [item=ff -cupric-nodule] дозволяє нескінченно видобувати [item=ff-iron-ore], [item=ff-copper-ore] і [item=stone], доповнюючи звичайний видобуток ресурсів. Видобуток [item=ff-cobalt-crust] дозволяє нескінченно видобувати [item=ff-cobalt-ru], який не утворюється в інших місцях.\n\nНуклеуси і кірки мають невеликі розміри і не можуть бути завантажені в контейнери, тому рекомендується переробляти їх на руду на самій днопоглиблювальній платформі.\n\nНа днопоглиблювальних платформах не можна розташовувати підземні конвеєри.
ff-rocket-silo=Ракетні шахти можуть бути розміщені лише на природні отвори під ракетну шахту.\nВи повинні запустити кілька [item=супутників] щоб дослідити [item=ff-interstellar-communicator], необхідний для перемоги в грі.

