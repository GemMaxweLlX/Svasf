ff-delivery-permits=[Space Age] Допуски через доставку для ключових технологій
ff-island-terrain-by-default=Острівний рельєф за замовчуванням
ff-map-tags=Мітки на карті для котлованів, кобальтових виходів і лавових басейнів
ff-classic-mode=Класичний режим
ff-transport-science-planet-techs=[Space Age] Транспортна наука в технологіях планет
ff-wagon-mk2-capacity=[Space Age] Множник місткості вагонів Mk2
ff-heavy-ship-speed=[Space Age] Швидкість важкого вантажного корабля
ff-swamp-ship-speed=[Space Age] Швидкість кораблів на болотах Глеби
ff-dredger-productivity-modules=[Space Age] Модулі продуктивності в земснарядах
ff-scrap-dredging-amount=[Space Age] Брухт за цикл драгування (у середньому)
ff-fluorine-seep-yield=[Space Age] Вихід фтористих джерел, %
ff-light-container-weight=[Space Age] Вага легкого/кріоконтейнера, кг
ff-freight-contract-size=[Space Age] Розмір міжзоряного фрахтового контракту
ff-contract-penalty=[Space Age] Штраф за прострочення, % контракту за 10 хв
ff-contract-deadline=[Space Age] Термін виконання контракту (базового розміру), хв
ff-contract-refresh=[Space Age] Оновлення пропозицій, хв
ff-contract-offer-lifetime=[Space Age] Термін пропозиції контракту, хв
ff-revert-locomotive-fuel-category=Змінити категорію палива для локомотивів
ff-disable-default-sims=Вимкнути імітацію ванільного меню
ff-k2-no-lead-ammo=Видалити вимоги щодо вмісту свинцю в боєприпасах для башти

lex-flying-cargo-speed-settings=Максимальна швидкість вантажного літака
lex-flying-heavyship-speed-settings=Максимальна швидкість бойового літака
lex-flying-cargo-inventory-size-settings=Розмір інвентарю вантажного літака
lex-flying-heavyship-inventory-size-settings=Розмір інвентарю бойового літака

[mod-setting-description]
ff-insurance-payout=Частка кожного стосу вантажу знищеного транспорту, яка потрапляє в найближчу страхову контору.
ff-delivery-permits=Ексклюзивна механіка режиму FF + Space Age: ключовим технологіям спершу потрібен допуск, який видається за доставку контейнера на дослідницький пост, що з’являється біля дослідженої частини планети.
ff-island-terrain-by-default=Острівний рельєф Freight Forwarding для Нувіса, навіть якщо не вибрано пресет «Freight Forwarding» (наприклад, пресет за замовчуванням або гра зі Space Age).
ff-classic-mode=Freight Forwarding точно як в 1.x, навіть зі Space Age: лавові басейни, кобальт і титаносталь на Нувісі, одна ракетна шахта, якій на Нувісі потрібен котлован, частини ракет з рамами з титаносталі й батарейними блоками. Інші планети — як у Space Age. Вимкнено — розширений режим з усіма можливостями Space Age цього мода.
ff-transport-science-planet-techs=Якщо вимкнено, технологіям з наукою інших планет транспортна наука не потрібна.
ff-wagon-mk2-capacity=Місткість вантажного вагона й цистерни Mk2 відносно звичайних.
ff-heavy-ship-speed=Швидкість важкого вантажного корабля (трюм ×2) відносно звичайного.
ff-swamp-ship-speed=Обмеження швидкості кораблів (крім болотних барж) на болотах Глеби, частка від їхньої максимальної швидкості.
ff-dredger-productivity-modules=Підводні гори не виснажуються, тож модулі продуктивності роблять драгування дуже сильним.
ff-scrap-dredging-amount=Скільки брухту земснаряд отримує з підводної гори за цикл (50 с за швидкості 1).
ff-fluorine-seep-yield=Вихід фтористих джерел на Аквілоні, у % від звичайного нафтового родовища.
ff-light-container-weight=Стала вага повного легкого або кріоконтейнера в ракеті. 1000 кг — без вигоди порівняно з розсипом.
ff-freight-contract-size=Скільки фрахтових партій треба доставити на край Сонячної системи для перемоги.
ff-contract-penalty=Після терміну щодесять хвилин до контракту додається така частка його розміру, доки його не виконано.
ff-contract-deadline=Час на виконання контракту базового розміру після прийняття; більшим контрактам — пропорційно більше.
ff-contract-refresh=З такою періодичністю всі пропозиції замінюються новими.
ff-contract-offer-lifetime=Пропозиція, не прийнята за цей час (±25%), зникає.
ff-revert-locomotive-fuel-category=Дозволяє локомотивам використовувати пальне, а не лише живитися від батареї. Увімкніть, якщо ви оновлюєтесь з попередньої версії Freight Forwarding і не хочете повторно заправляти потяг.\nЦе налаштування може бути вилучено в наступних оновленнях.

[map-gen-preset-name]
default=Ваніль за замовчуванням [img=utility/warning_icon] [font=default-bold][color=yellow](ЗМІНИТЕ ЦЕ НА ПЕРЕВЕЗЕННЯ ВАНТАЖІВ ЗА ЗАМОВЧАННЯМ)[/color][/font] [img=utility/warning_icon] [img=utility/warning_icon]
x-default=Експедиція за замовчуванням
ff-ribbon-world=Експедиція вантажів - Стрічковий світ [color=purple](експериментальний)[/color]

[map-gen-preset-description]
default=[font=default-bold][color=yellow]У ПРЕВЕНТАЦІЇ VANILLA ЗА ПРОГРАМОЮ ЗА замовчуванням НЕ ВИКОРИСТОВУЄТЬСЯ ГЕНЕРАЦІЯ КАРТ ЕКСПЕДИТОРСЬКИХ ПЕРЕВЕЗЕНЬ[/color][/font]\nРекомендуємо змінити на "[font=default-bold][color=green]Експедиторські перевезення за замовчуванням[/color][/font]" у випадаючому списку зверху.
x-default=Рекомендований спосіб гри в "Експедицію вантажів". Має переважно відокремлені великі острови та віддалені один від одного ресурси.\nЗмінюйте налаштування [font=default-semibold]Ворога[/font] на свій розсуд.
ff-ribbon-world=Експедиція вантажів на стрічковому світі. Все ті ж острови, але висота карти обмежена 5 шматками й ресурси регулюються відповідно.\n [font=default-bold][color=blue]Переконайтеся, що на стартовому острові є свинець, коли будете перезапускати карту[/color][/font]

