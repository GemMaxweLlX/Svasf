[technology-description]
ff-cargo-insurance=Страхові контори відшкодовують частину вантажу знищених вагонів, кораблів, човнів і павуків (див. налаштування мапи).
ff-subsea-pipeline=Трубопроводи по морському дну довжиною до __1__ клітинок: вузол на кожному березі й прокладена між ними труба. З Fluid Must Flow є й вузол магістралі з величезною пропускною здатністю.
ff-tank-containers=Контейнери для рідин по __1__ одиниць: заповнюються й зливаються в хімзаводі. Рідини їдуть кораблями, поїздами й ракетами без танкерів і бочок.
ff-caravan-alliance=Караван погоджується ретранслювати сигнал вашого міжгалактичного приймача-передавача до зірок. Видається за виконання першого міжзоряного фрахтового контракту.
ff-caravan-alliance-trigger=Виконайте перший міжзоряний фрахтовий контракт
ff-permit=Доставте __1__ × [item=__2__] на дослідницький пост на [planet=__3__], щоб отримати право досліджувати «__4__». Пост з’являється біля дослідженої частини планети, щойно допуск стає доступним; контейнери витрачаються.
ff-permit-trigger=Доставте __1__ × [item=__2__] на дослідницький пост на [planet=__3__]
ff-sonar-buoy=Сканує великі ділянки води. Сонар бачить набагато далі за радар чи сейсмосканер, але суходіл його блокує.
ff-light-rocket-silo=Легкі ракетні шахти (500 кг), які на Нувісі ставляться лише в котловани, малі посадкові майданчики та легкі стартові набори космічних платформ.
ff-heavy-lift-rockets=Повнорозмірні ракетні шахти (1000 кг), які можна ставити будь-де, посадкові майданчики й стартові набори космічних платформ.\nЄ три версії цієї технології — для Вулкануса, Фульгори та Глеби: дослідження будь-якої завершує інші.\nКожна з цих планет має власний рецепт ракетної шахти з місцевих матеріалів, який виготовляється лише там.
ff-heavy-rocket-silo=Ракетні шахти, що піднімають 2000 кг. Частини їхніх ракет збираються з рам з титаносталі.
ff-lithium-battery-pack=Найкраще батарейне паливо: 25 МДж, швидший розгін і вища швидкість, і воно не втрачає заряд. Виробляється на Аквілоні.
ff-refrigerated-containers=Контейнери для предметів, що псуються, виробляються на Глебі. Вміст псується в __1__ разів повільніше.
ff-scanners-mk2=Сейсмосканери й сонарні буї з подвійною дальністю. Виробляються на Аквілоні.
ff-fast-charging=Зарядні станції, що працюють утричі швидше. Виробляються на Фульгорі.
ff-dredging-productivity=+20% продуктивності драгування конкрецій і кобальтової кірки.
ff-cryo-containers=Контейнери для предметів, що псуються, — псуються в 20 разів повільніше, вага повного стала. Виробляються на Аквілоні.
ff-light-containers=Вольфрамові контейнери зі сталою вагою повного: запуски важких вантажів у космос набагато дешевші. Виробляються на Вулканусі.
ff-heavy-cargo-ship=Вантажні кораблі з подвійним трюмом.
ff-fast-cargo-ship=Вантажні кораблі в 1,5 раза швидші.
ff-freight-science-pack=Науковий пакет, що збирається на Аквілоні з транспортної науки, титаносталі, зарядженого батарейного блока, рефрижераторного контейнера та літію. Потрібен усім технологіям з кріогенною наукою.
ff-rolling-stock-mk2=Вантажні вагони й цистерни в 1,5 раза місткіші. Виробляються на Вулканусі.
ff-locomotive-mk3=Найшвидші локомотиви. Виробляються на Аквілоні.
ff-locomotive-mk2=Швидші й потужніші локомотиви. Виробляються на Фульгорі.
ff-lava-barge=Кораблі з тепловим захистом для лавових озер Вулкануса. Водні шляхи можна прокладати лавою; інші кораблі там горять.
ff-icebreaker=Кораблі, що прорубують канали в кризі Аквілона.
ff-swamp-barge=Плоскодонні кораблі для боліт Глеби, де інші кораблі йдуть набагато повільніше.
ff-dredger-mk3=Важкий земснаряд: найшвидший, 4 слоти модулів.
ff-dredger-mk2=Більший і швидший земснаряд зі слотами модулів.
ff-interstellar-freight-contract=Далекий караван — низка міжзоряних вантажовозів — проходить край Сонячної системи без гальмування й забирає вантаж на льоту. Чекайте його там з космічною платформою та фрахтовими партіями в хабі. Перший виконаний контракт — перемога (просто долетіти до краю недостатньо); караван пропонує три контракти на вибір, кожен зі своїм розміром і нагородою (вибір на панелі контрактів, кнопка панелі швидкого доступу).
ff-sea-infrastructure=Портові крани, кабельні термінали, підводні кабелі, морські вітряки та припливні станції.
ff-transport-science-pack=Дозволяє досліджувати міжконтинентальну логістику та перероблення нафти.
ff-seismic-scanner=Підземне сканування може проникати далі, ніж радар, але тільки через з'єднані ділянки суші.
ff-dredging=Видобувайте поліметалевих конкрецій з підводних гір і переробляйте їх на нескінченні ресурси.
ff-advanced-railway=Потяги на акумуляторах, які можуть проїхати набагато далі, з більшою кількістю вантажу.
ff-battery-charging=Транспортувати електроенергію за допомогою заряджених акумуляторів.
ff-battery-pack=Більш щільне та надійне мобільне зберігання електроенергії.
ff-cobalt-processing=Відкрийте для себе кобальтову кірку на підводних горах, корисну для передових акумуляторних технологій і як нескінченне джерело свинцю та титану.
ff-titansteel-processing=Виплавляють титанову сталь у природних лавових басейнах. У процесі охолодження утворюється пара, яку можна перетворити на електроенергію.
landfill=Можна ставити на неглибокій воді, щоб створити рельєф, на якому можна будувати.
lex-flying-cargo-ships=Літак дальнього радіуса дії без зброї, корисний для дистанційного будівництва аванпостів на інших островах.
ff-rocket-silo=Дозволяє запускати ракету в космос.\nРакетні шахти можна розміщувати лише в природних дірках під ракетні шахти.
ff-interstellar-communication=Дозволяє запустити міжзоряний комунікатор у космос і перемогти у грі.

[fuel-category-name]
battery=Джерело живлення від акумулятора
advanced-chemical=Удосконалене горюче паливо

[mod-setting-name]
