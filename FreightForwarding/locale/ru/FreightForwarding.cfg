flagship=Флагман каравана. Доверяет только проверенным партнёрам; платит чертежами своего флота дронов.
navigation=Следопыт каравана. Платит алгоритмами маршрутизации, собранными за века.
survey=Изучил тысячи астероидов и лун. Платит данными разведки недр.
