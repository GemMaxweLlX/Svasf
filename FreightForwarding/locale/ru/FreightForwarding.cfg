[entity-description]
ff-port-crane=Групповой манипулятор с длинной рукой (3 тайла) и большим захватом — для погрузки кораблей с причала и обратно.
ff-cable-terminal=Его провода дотягиваются на 64 тайла, но только до других кабельных терминалов: электричество через море на другие острова. Очень маленькая зона снабжения.
ff-offshore-wind-turbine=Ставится на воду. До 1 МВт в зависимости от ветра, который медленно меняется.
ff-tidal-generator=Ставится на мелководье. До 600 кВт по приливу (цикл 20 минут).
ff-dredger-mk2=Большой земснаряд: вдвое быстрее, 2 слота модулей. Ставится на подводную гору.
ff-dredger-mk3=Тяжёлый земснаряд: втрое быстрее, 4 слота модулей. Ставится на подводную гору.
ff-scrap-seamount=Обломки на дне глубокого нефтяного океана. Постройте на ней земснаряд.
ff-fluorine-seep=Фтор, поднимающийся со дна аммиачного океана. Постройте на нём нефтяную вышку.
ff-swamp-barge=Плоскодонная: единственный корабль, который не ползёт по болотам Глебы.
ff-icebreaker=Превращает лёд вокруг себя в битый лёд, по которому можно прокладывать водные пути дальше. Маленький трюм.
ff-spoilage-sensor=Поставьте в пределах 4 тайлов от станции. Выдаёт порчу груза стоящего поезда в процентах (самая испорченная стопка и среднее). Используйте в условии ожидания по сигналу.
ff-lava-barge=Грузовой корабль с жаростойким корпусом. Остальные корабли на лаве горят.
ff-locomotive-mk2=Сверхпроводящие двигатели: в 1,25 раза быстрее, мощность ×1,6.
ff-locomotive-mk3=Литиевый привод: в 1,5 раза быстрее, мощность ×2,2.
ff-cargo-wagon-mk2=Вольфрамовая рама: вместимость в 1,5 раза больше (настройка).
ff-fluid-wagon-mk2=Вольфрамовый бак: объём в 1,5 раза больше (настройка).
ff-fast-cargo-ship=Грузовой корабль с двигателями из карбида вольфрама: в 1,5 раза быстрее.
ff-heavy-cargo-ship=Грузовой корабль с двойным трюмом, но медленнее.
ff-fuel-depot=Поставьте в пределах 10 тайлов от станции или порта. Остановившиеся поезда и корабли заправляются из него и сдают в него сгоревшее топливо (разряженные батареи).
ff-fast-charging-station=Заряжает батареи в 3 раза быстрее.
ff-cobalt-vent=Богатая кобальтом корка в лавовом озере. Постройте на ней платформу земснаряда, чтобы добывать кобальтовую корку.
ff-heavy-rocket-silo=Ракета поднимает 2000 кг. Части ракеты требуют рам из титаностали, которую плавят только в лава-бассейнах Вулкануса. Строится где угодно.
ff-light-rocket-silo=Дешёвая ракетная шахта для первых полётов в космос. Ракета поднимает только 500 кг и требует 20 частей.\nНа Нувисе строится только точно на шахтном котловане, на других планетах — где угодно.
ff-small-cargo-landing-pad=Дешёвая посадочная площадка всего на 20 ячеек. Улучшается до обычной заменой поверх.
ff-seismic-scanner=Сканирует соединенные территории суши, вызывая значительное загрязнение. Невозможно разместить на расстоянии менее 16 клеток от воды.
ff-seamount=Подводная гора, которую можно выкапывать в поисках бесконечных полиметаллических конкреций.
ff-rocket-silo=Используется для создания и запуска ракеты для получения научных данных из космоса.\nМожно размещать только в отверстиях для ракетных шахт природного происхождения.

