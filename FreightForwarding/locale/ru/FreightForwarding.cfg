[item-description]
ff-freight-consignment=Товары пяти миров, опечатанные для полёта длиной в сто лет. Лёгкий контейнер становится частью защитной обшивки груза и улетает вместе с ним к другим звёздам. Их забирает Дальний караван на краю Солнечной системы.
ff-damaged-container=Повредился при распаковке. Почините его за четверть материалов или отправьте в переработчик.
ff-deformed-titansteel-plate=Горячая титаносталь, остывшая сама по себе. Литейная может только переплавить её обратно в сталь и титан.
ff-freight-science-pack=Собирается на Аквилоне из компонентов всех планет.
ff-light-container=Полный лёгкий контейнер всегда весит одинаково, что бы ни было внутри (см. вес). Производится на Вулканусе.
ff-cryo-container=Перевозит портящиеся предметы, они портятся в 20 раз медленнее. Вес полного криоконтейнера постоянный. Производится на Аквилоне.
ff-reefer-container=Перевозит портящиеся предметы. Содержимое портится в 5 раз медленнее. Производится на Глебе.
ff-light-space-platform-starter-pack=Достаточно лёгкий (500 кг) для лёгкой ракетной шахты. Даёт меньше плит фундамента.
battery=Хранит 4 мДж когда заряжено.
ff-battery-pack=Хранит 10 мДж когда заряжено.
landfill=Можно расположить на мелководье для создания земли на которой можно строить.
bbr-rail-common=Нельзя расположить на глубокой воде.
ff-interstellar-communicator=Можно запустить в ракете для победы в игре.

