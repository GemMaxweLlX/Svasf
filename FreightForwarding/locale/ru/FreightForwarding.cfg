[map-gen-preset-description]
default=[font=default-bold][color=yellowСТАНДАРТНАЯ ГЕНЕРАЦИЯ НЕ ПОДДЕРЖИВАЕТ ГЕНЕРАЦИЮ ИЗ FREIGHT FORWARDING.[/color][/font]\nМы рекомендуем сменить на "[font=default-bold][color=green]Freight Forwarding[/color][/font]" в выпадающем списке ниже.
x-default=Рекомендуемые настройки для игры в Freight Forwarding. Имеет в основном разъеденённые крупные острова и более разбросанные в пространстве ресурсы.\nНастраивайте [font=default-semibold]Enemy[/font] параметры по вашему желанию.
ff-ribbon-world=Freight Forwarding на мире-ленте. Всё ещё острова, но высота карты ограничена пятью чанками, ресурсы соответствующее скорректированы.\n [font=default-bold][color=blue]Убедитесь, что у вас есть свинец на стартовом острове[/color][/font]

