[tips-and-tricks-item-description]
ff-sa-rocket-tiers=Первая [item=ff-light-rocket-silo] поднимает 500 кг и на Нувисе ставится только точно в кратер. Обычная [item=rocket-silo] (1 т) открывается наукой первой посещённой планеты и делается только там; ставится где угодно. [item=ff-heavy-rocket-silo] (2 т) — с Аквилона.
ff-sa-planet-chains=Каждая планета делает то, что больше никто: титан и свинец — Нувис, кобальт и титаносталь — Вулканус, кобальт-гольмиевые батарейные блоки — Фульгора, рефрижераторные контейнеры — Глеба, литиевые блоки и фрахтовую науку — Аквилон. Заряжать батареи можно везде.
ff-sa-container-tiers=Контейнеры четырёх уровней: [item=ic-container] обычный, [item=ff-reefer-container] рефрижераторный (Глеба, порча ×5 медленнее), [item=ff-light-container] лёгкий (Вулканус, постоянный вес в ракете) и [item=ff-cryo-container] крио (Аквилон, порча ×20 медленнее). У каждого свои вкладки упаковки и распаковки. Испорченный контейнер содержит то, во что портится товар.
ff-sa-damaged-containers=При распаковке 2% контейнеров возвращаются повреждёнными, 1% теряется. Почините их вручную за четверть материалов или отправьте в переработчик.
ff-sa-dredgers=Земснаряды работают и на других планетах: кобальтовые выходы в лаве Вулкануса, подводные горы с ломом на глубоком нефтяном океане Фульгоры. Земснаряды Mk2 (Вулканус) и Mk3 (Аквилон) больше и быстрее, принимают модули (без продуктивности) и кладут платформу больше. Платформа не ложится на водные пути, рельсы и поезда.
ff-sa-bridges=Опоры рельсов нельзя ставить в глубокой воде, поэтому надземные рельсы проходят только через мелкие проливы. Через открытый океан — по-прежнему корабли.
ff-sa-lava-barges=На Вулканусе водные пути можно класть по лаве. Обычные корабли там горят, [item=ff-lava-barge] защищена от жара.
ff-sa-swamp-barges=На болотах Глебы корабли идут намного медленнее. Плоскодонная [item=ff-swamp-barge] — на полной скорости.
ff-sa-icebreaker=На Аквилоне [item=ff-icebreaker] превращает лёд вокруг себя в битый лёд, и водные пути можно прокладывать дальше во льды.
ff-sa-fluorine-seeps=Фтористые источники на дне аммиачного океана Аквилона качает нефтяная вышка.
ff-sa-spoilage-sensor=Поставьте [item=ff-spoilage-sensor] в пределах 4 тайлов от станции. Он выдаёт порчу груза стоящего поезда в процентах — для условий ожидания по сигналу.
ff-sa-hot-titansteel=Горячую титаносталь нужно охладить за 2 минуты. Иначе она деформируется, и литейная сможет только переплавить её обратно в сталь и титан.
ff-sa-freight-contract=Дальний караван — межзвёздные грузовозы на маршруте длиной в века — не может позволить себе тормозить. На краю Солнечной системы он забирает груз на лету с ожидающих платформ. Соберите [item=ff-freight-consignment] из товаров всех планет, доставьте их на платформу на краю и держите в хабе. Партии улетают с караваном навсегда, вместе с лёгкими контейнерами. Выберите один из трёх контрактов на панели контрактов (кнопка на панели быстрого доступа): каждый корабль каравана просит своё количество и платит по-своему (роботы, добыча, исследования, манипуляторы, ручная сборка). Просто долететь до края — ещё не победа.
ff-oil=Нефть можно получить только с морских нефтяных месторождений. Каждый грузовой корабль может быть загружен до трех [entity=pump]. Удерживайте насос в руке, чтобы увидеть правильные позиции расположения.\nПерекачивание напрямую из нефтяной вышки на грузовой корабль гораздо быстрее, чем перекачивание из подводных труб.

