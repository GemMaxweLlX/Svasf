x-default=Рекомендуемые настройки для игры в Freight Forwarding. Имеет в основном разъеденённые крупные острова и более разбросанные в пространстве ресурсы.\nНастраивайте [font=default-semibold]Enemy[/font] параметры по вашему желанию.
