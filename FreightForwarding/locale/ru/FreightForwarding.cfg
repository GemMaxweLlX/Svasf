[mod-setting-description]
ff-contract-offer-lifetime=Непринятое за это время (±25%) предложение исчезает.
ff-contract-refresh=С такой периодичностью все предложения заменяются новыми.
ff-contract-deadline=Время на выполнение контракта базового размера после принятия; большим контрактам — пропорционально больше.
ff-contract-penalty=После срока каждые 10 минут к контракту добавляется такая доля его размера, пока он не выполнен.
ff-freight-contract-size=Сколько фрахтовых партий нужно доставить на край Солнечной системы для победы.
ff-light-container-weight=Постоянный вес полного лёгкого или криоконтейнера в ракете. 1000 кг — без выгоды по сравнению с россыпью.
ff-fluorine-seep-yield=Выход фтористых источников на Аквилоне, в % от обычного нефтяного месторождения.
ff-scrap-dredging-amount=Сколько лома земснаряд получает с подводной горы за цикл (50 с при скорости 1).
ff-dredger-productivity-modules=Подводные горы не истощаются, поэтому модули продуктивности делают драгирование очень сильным.
ff-swamp-ship-speed=Ограничение скорости кораблей (кроме болотных барж) на болотах Глебы, доля от их максимальной скорости.
ff-heavy-ship-speed=Скорость тяжёлого грузового корабля (трюм ×2) относительно обычного.
ff-wagon-mk2-capacity=Вместимость грузового вагона и цистерны Mk2 относительно обычных.
ff-transport-science-planet-techs=Если выключено, технологиям с наукой других планет транспортная наука не нужна.
ff-classic-mode=Freight Forwarding как в оригинале 1.x, даже с Space Age: лава-бассейны, кобальт и титаносталь на Нувисе, одна ракетная шахта, которая на Нувисе ставится только в котлован, части ракеты с рамами из титаностали и батарейными блоками. Другие планеты остаются как в Space Age.
ff-island-terrain-by-default=Использовать островной рельеф Freight Forwarding на Нувисе, даже если не выбран пресет карты «Freight Forwarding» (например, пресет «По умолчанию» или игра с Space Age).
ff-revert-locomotive-fuel-category=Позволяет локомотивам использовать горючее топливо, а не только батареии. Используйте, если вы хотите обновить мод без переделывания заправки поездов.\nДанная настройка может быть удалена в будущих обновлениях.

