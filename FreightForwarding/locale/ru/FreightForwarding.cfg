[technology-description]
ff-sea-infrastructure=Портовые краны, кабельные терминалы, морские ветряки и приливные станции.
ff-interstellar-freight-contract=Дальний караван — вереница межзвёздных грузовозов — проходит край Солнечной системы без торможения и забирает груз на лету. Ждите его там с космической платформой и фрахтовыми партиями в хабе. Первый выполненный контракт — победа (просто долететь до края недостаточно); караван предлагает три контракта на выбор, у каждого свой размер и награда (выбор на панели контрактов, кнопка на панели быстрого доступа).
ff-dredger-mk2=Больший и более быстрый земснаряд со слотами модулей.
ff-dredger-mk3=Тяжёлый земснаряд: самый быстрый, 4 слота модулей.
ff-swamp-barge=Плоскодонные корабли для болот Глебы, где другие корабли идут намного медленнее.
ff-icebreaker=Корабли, прорубающие каналы во льду Аквилона.
ff-lava-barge=Жаростойкие корабли для лавовых озёр Вулкануса. Водные пути можно прокладывать по лаве; остальные корабли там горят.
ff-locomotive-mk2=Более быстрые и мощные локомотивы. Производятся на Фульгоре.
ff-locomotive-mk3=Самые быстрые локомотивы. Производятся на Аквилоне.
ff-rolling-stock-mk2=Грузовые вагоны и цистерны в 1,5 раза вместительнее. Производятся на Вулканусе.
ff-freight-science-pack=Научный пакет, собираемый на Аквилоне из транспортной науки, титаностали, заряженного батарейного блока, рефрижераторного контейнера и лития. Нужен всем технологиям с криогенной наукой.
ff-fast-cargo-ship=Грузовые корабли в 1,5 раза быстрее.
ff-heavy-cargo-ship=Грузовые корабли с двойным трюмом.
ff-light-containers=Вольфрамовые контейнеры, которые в заполненном виде имеют постоянный вес: тяжёлые грузы запускать в космос гораздо дешевле. Производятся на Вулканусе.
ff-cryo-containers=Контейнеры для портящихся предметов: портятся в 20 раз медленнее, вес полного постоянный. Производятся на Аквилоне.
ff-dredging-productivity=+20% к продуктивности добычи конкреций и кобальтовой корки.
ff-fast-charging=Станции зарядки, работающие в 3 раза быстрее. Производятся на Фульгоре.
ff-scanners-mk2=Сейсмосканеры и сонар-буи с вдвое большей дальностью. Производятся на Аквилоне.
ff-refrigerated-containers=Контейнеры для портящихся предметов, производятся на Глебе. Содержимое портится в __1__ раз медленнее.
ff-lithium-battery-pack=Лучшее батарейное топливо: 25 МДж, быстрее разгон и выше скорость, не теряет заряд. Производится на Аквилоне.
ff-heavy-rocket-silo=Ракетные шахты, поднимающие 2000 кг. Части их ракет собираются из рам титаностали.
ff-heavy-lift-rockets=Полноразмерные ракетные шахты (1000 кг), которые можно строить где угодно, посадочные площадки и стартовые наборы космических платформ.\nЕсть три версии технологии — для Вулкануса, Фульгоры и Глебы: изучение любой завершает остальные.\nУ каждой из этих планет свой рецепт шахты из местных материалов, и скрафтить его можно только там.
ff-light-rocket-silo=Лёгкие ракетные шахты (500 кг), которые на Нувисе строятся только в шахтных котлованах, малые посадочные площадки и лёгкие стартовые наборы платформ.
ff-transport-science-pack=Позволяет исследовать межконтинентальную логистику и переработку нефти.
ff-seismic-scanner=Сигналы подземного сканеры могут перемещаться дальше, чем сигналы радара, но только через соединённые участки суши.
ff-dredging=Добывайте полиметаллические конкреции из подводных гор и перерабатывайте их в бесконечные ресурсы.
ff-advanced-railway=Поезда на аккумуляторах, способные перемещаться дальше с большим количеством груза.
ff-battery-charging=Транспортируйте электричество с помощью заряженных аккумуляторов.
ff-battery-pack=Более ёмкое и надёжное мобильное энергохранилище.
ff-titansteel-processing=Плавьте титановую сталь в естественных лавовых бассейнах. При охлаждении выделяется пар, который можно использовать для получения электричества.
landfill=Можно расположить на мелководье для создания земли на которой можно строить.
lex-flying-cargo-ships=Невооружённый самолёт большой дальности, подходящий для удалённого строительства аванпостов на других островах.
ff-rocket-silo=Позволяет запускать ракеты в космос.\nРакетные шахты можно построить только в находимых на карте дыр под ракетную шахту.
ff-interstellar-communication=Позволяет запустить межзвездный коммуникатор в космос и выиграть игру.

