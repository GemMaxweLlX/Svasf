signal=Сигнал из-за края системы: мимо проходит Дальний караван и забирает груз на лету. Товары пяти миров, опечатанные на сто лет. Выберите контракт на панели контрактов (кнопка на панели быстрого доступа) и доставьте партии на платформу на краю Солнечной системы.
