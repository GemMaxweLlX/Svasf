[entity-description]
ff-fast-cargo-ship=Грузовой корабль с двигателями из карбида вольфрама: в 1,5 раза быстрее.
ff-heavy-cargo-ship=Грузовой корабль с двойным трюмом, немного медленнее.
ff-fuel-depot=Поставьте в пределах 10 тайлов от станции или порта. Остановившиеся поезда и корабли заправляются из него и сдают в него сгоревшее топливо (разряженные батареи).
ff-fast-charging-station=Заряжает батареи в 3 раза быстрее.
ff-cobalt-vent=Богатая кобальтом корка в лавовом озере. Постройте на ней платформу земснаряда, чтобы добывать кобальтовую корку.
ff-heavy-rocket-silo=Ракета поднимает 2000 кг. Части ракеты требуют рам из титаностали, которую плавят только в лава-бассейнах Вулкануса. Строится где угодно.
ff-light-rocket-silo=Дешёвая ракетная шахта для первых полётов в космос. Ракета поднимает только 500 кг и требует 20 частей.\nНа Нувисе строится только точно на шахтном котловане, на других планетах — где угодно.
ff-small-cargo-landing-pad=Дешёвая посадочная площадка всего на 20 ячеек. Улучшается до обычной заменой поверх.
ff-seismic-scanner=Сканирует соединенные территории суши, вызывая значительное загрязнение. Невозможно разместить на расстоянии менее 16 клеток от воды.
ff-seamount=Подводная гора, которую можно выкапывать в поисках бесконечных полиметаллических конкреций.
ff-rocket-silo=Используется для создания и запуска ракеты для получения научных данных из космоса.\nМожно размещать только в отверстиях для ракетных шахт природного происхождения.

