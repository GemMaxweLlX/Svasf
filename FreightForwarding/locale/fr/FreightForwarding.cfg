cargo=Un énorme cargo. Paie avec les plans de ses machines de chargement.
archive=Transporte les archives scientifiques d'une douzaine de mondes. Paie avec des copies.
survey=A sondé des milliers d'astéroïdes et de lunes. Paie avec des données de prospection.
navigation=Un éclaireur de la caravane. Paie avec des algorithmes de routage accumulés pendant des siècles.
flagship=Le vaisseau amiral de la caravane. Ne fait confiance qu'aux partenaires éprouvés ; paie avec les plans de sa flotte de drones.
forge=Un navire-forge qui exploite des astéroïdes entiers. Paie avec ses secrets d'extraction.
observatory=Un observatoire de l'espace lointain. Paie avec des siècles d'observations.

