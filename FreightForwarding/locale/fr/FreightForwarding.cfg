[entity-description]
ff-research-post=Une station laissée par la première expédition de la Longue Caravane, trouvée endommagée. Livrez les matériaux de réparation affichés au-dessus pour la restaurer, puis les conteneurs demandés : elle envoie ses archives dans une capsule de fret et accorde une autorisation de rechercher une technologie clé. 5 minutes plus tard, elle s'autodétruit.
ff-cable-landing=Les deux extrémités d'un câble posé sur le fond marin (Nauvis) ou à travers les marais (Gleba). Construisez-en un sur chaque rive, ouvrez-en un et choisissez où va le câble : distance, câble nécessaire (1 par case, propre à chaque planète) et durée de pose. Une fois posé, il fonctionne comme un câble normal, dans les deux sens.
ff-sonar-buoy=Scanne de grandes étendues d'eau. Bloquée par les terres.
ff-small-cargo-landing-pad=Une plateforme d'atterrissage moins chère, avec seulement 20 emplacements. Peut être améliorée sur place en plateforme normale.
ff-light-rocket-silo=Un silo moins cher pour les premiers voyages dans l'espace. Les fusées n'emportent que 500 kg et demandent 20 pièces.\nSur Nauvis, il ne se construit qu'exactement dans un cratère de silo ; ailleurs, n'importe où.
ff-heavy-rocket-silo=Les fusées emportent 2000 kg. Leurs pièces nécessitent des cadres en titanacier, fondu uniquement dans les bassins de lave de Vulcanus. Se construit n'importe où.
ff-cobalt-vent=Croûte riche en cobalt qui se forme dans un lac de lave. Construisez une plateforme de dragage dessus pour extraire la croûte de cobalt.
ff-fast-charging-station=Recharge les batteries 3 fois plus vite.
ff-fuel-depot=À placer à moins de 10 cases d'un arrêt de train ou d'un port. Les trains et navires arrêtés s'y ravitaillent et y déposent leur combustible usé (batteries vides).
ff-heavy-cargo-ship=Un cargo à double cale, mais plus lent.
ff-fast-cargo-ship=Un cargo à moteurs en carbure de tungstène : 1,5 fois plus rapide.
ff-fluid-wagon-mk2=Citerne en tungstène : 1,5 fois plus de capacité (paramètre).
ff-cargo-wagon-mk2=Châssis en tungstène : 1,5 fois plus de capacité (paramètre).
ff-locomotive-mk3=Propulsion au lithium : 1,5 fois plus rapide, 2,2 fois plus puissante.
ff-locomotive-mk2=Moteurs supraconducteurs : 1,25 fois plus rapide, 1,6 fois plus puissante.
ff-lava-barge=Un cargo doté d'un bouclier thermique. Les autres navires brûlent sur la lave.
ff-spoilage-sensor=À placer à moins de 4 cases d'un arrêt de train. Indique l'avarie de la cargaison du train arrêté, en pourcentage (pile la plus avariée et moyenne). À utiliser dans une condition d'attente par signal.
ff-icebreaker=Brise la glace autour de lui en glace brisée, sur laquelle on peut prolonger les voies navigables. Petite cale.
ff-swamp-barge=À fond plat : le seul navire qui ne se traîne pas dans les marais de Gleba.
ff-fluorine-seep=Du fluor qui remonte du fond de l'océan ammoniacal. Construisez une plateforme pétrolière dessus.
ff-scrap-seamount=Des épaves entassées au fond de l'océan de pétrole profond. Construisez une drague dessus.
ff-dredger-mk3=Une drague lourde : trois fois plus rapide, 4 emplacements de modules. Se construit sur un mont sous-marin.
ff-dredger-mk2=Une drague plus grande : deux fois plus rapide, 2 emplacements de modules. Se construit sur un mont sous-marin.
ff-tidal-generator=Se construit en eau peu profonde. Jusqu'à 600 kW selon la marée (cycle de 20 minutes).
ff-offshore-wind-turbine=Se construit sur l'eau. Jusqu'à 1 MW selon le vent, qui change lentement.
ff-cable-terminal=Ses câbles portent à 64 cases, mais uniquement vers d'autres terminaux : du courant à travers la mer vers d'autres îles. Très petite zone d'alimentation.
ff-port-crane=Un bras robotisé en vrac à longue portée (3 cases) et grande pince, pour charger les navires depuis le quai et inversement.
ff-seismic-scanner=Scanne les masses terrestres connectées, produisant une pollution importante. Ne peut pas être placé à 16 tuiles de l'eau.
ff-seamount=Montagnes sous-marines qui peuvent être draguées pour des nodules polymétalliques infinis.
ff-rocket-silo=Utilisé pour fabriquer et lancer une fusée afin de recevoir des données scientifiques de l'espace.\nNe peut être placé que sur des trous de silo survenant naturellement.

