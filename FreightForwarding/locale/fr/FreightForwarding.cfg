[technology-description]
ff-caravan-alliance=La caravane accepte de relayer vers les étoiles le signal de votre émetteur-récepteur intergalactique. Accordée en remplissant le premier contrat de fret interstellaire.
ff-caravan-alliance-trigger=Remplissez le premier contrat de fret interstellaire
ff-permit=Livrez __1__ × [item=__2__] au poste de recherche sur [planet=__3__] pour avoir le droit de rechercher « __4__ ». Le poste apparaît près de la zone explorée de la planète dès que l'autorisation est disponible ; les conteneurs sont consommés.
ff-permit-trigger=Livrez __1__ × [item=__2__] au poste de recherche sur [planet=__3__]
ff-sonar-buoy=Scanne de grandes étendues d'eau. Le sonar porte bien plus loin qu'un radar ou un scan sismique, mais il est bloqué par les terres.
ff-light-rocket-silo=Silos à fusée légers (500 kg) qui ne se construisent que dans les cratères de silo sur Nauvis, petites plateformes d'atterrissage et kits de démarrage légers.
ff-heavy-lift-rockets=Silos à fusée pleine taille (1000 kg) constructibles n'importe où, plateformes d'atterrissage et kits de démarrage de plateforme spatiale.\nIl existe trois versions de cette technologie, une pour Vulcanus, Fulgora et Gleba : en rechercher une termine les autres.\nChacune de ces planètes a sa propre recette de silo à base de matériaux locaux, fabricable uniquement sur place.
ff-heavy-rocket-silo=Silos à fusée emportant 2000 kg. Leurs pièces de fusée sont faites de cadres en titanacier.
ff-lithium-battery-pack=Le meilleur combustible à batterie : 25 MJ, meilleure accélération et vitesse maximale, et il ne perd pas sa charge. Fabriqué sur Aquilo.
ff-refrigerated-containers=Conteneurs pour objets périssables, fabriqués sur Gleba. Le contenu s'avarie __1__ fois plus lentement.
ff-scanners-mk2=Scanners sismiques et bouées sonar à portée doublée. Fabriqués sur Aquilo.
ff-fast-charging=Stations de recharge 3 fois plus rapides. Fabriquées sur Fulgora.
ff-dredging-productivity=+20 % de productivité du dragage des nodules et de la croûte de cobalt.
ff-cryo-containers=Conteneurs pour objets périssables, qui s'avarient 20 fois plus lentement, au poids fixe une fois pleins. Fabriqués sur Aquilo.
ff-light-containers=Conteneurs en tungstène au poids fixe une fois pleins : des lancements de fusée bien moins chers pour les marchandises lourdes. Fabriqués sur Vulcanus.
ff-heavy-cargo-ship=Cargos à double cale.
ff-fast-cargo-ship=Cargos 1,5 fois plus rapides.
ff-freight-science-pack=Un pack de science assemblé sur Aquilo à partir de science du transport, de titanacier, d'un bloc-batterie chargé, d'un conteneur frigorifique et de lithium. Nécessaire à toutes les technologies utilisant la science cryogénique.
ff-rolling-stock-mk2=Wagons de marchandises et wagons-citernes 1,5 fois plus grands. Fabriqués sur Vulcanus.
ff-locomotive-mk3=Les locomotives les plus rapides. Fabriquées sur Aquilo.
ff-locomotive-mk2=Locomotives plus rapides et plus puissantes. Fabriquées sur Fulgora.
ff-lava-barge=Navires à bouclier thermique pour les lacs de lave de Vulcanus. On peut construire des voies navigables sur la lave ; les autres navires y brûlent.
ff-icebreaker=Navires qui ouvrent des chenaux dans la glace d'Aquilo.
ff-swamp-barge=Navires à fond plat pour les marais de Gleba, où les autres navires vont beaucoup plus lentement.
ff-dredger-mk3=Une drague lourde : la plus rapide, avec 4 emplacements de modules.
ff-dredger-mk2=Une drague plus grande et plus rapide, avec des emplacements de modules.
ff-interstellar-freight-contract=La Longue Caravane, une chaîne de cargos interstellaires, passe le bord du système solaire sans freiner et prend la cargaison au vol. Attendez-la là-bas avec une plateforme spatiale et des lots de fret dans son hub. Le premier contrat rempli fait gagner la partie (atteindre le bord ne suffit pas) ; la caravane propose trois contrats à la fois, chacun avec sa taille et sa récompense (à choisir dans le panneau des contrats, bouton de la barre de raccourcis).
ff-sea-infrastructure=Grues portuaires, terminaux de câble, câbles sous-marins, éoliennes en mer et usines marémotrices.
ff-transport-science-pack=Permet la recherche de la logistique intercontinentale et du traitement du pétrole.
ff-seismic-scanner=Les scans souterrains peuvent voyager plus loin qu'un radar, mais seulement à travers des masses terrestres connectées.
ff-dredging=Récupérez les nodules polymétalliques à partir des monts sous-marins et transformez-les en ressources infinies.
ff-advanced-railway=Trains alimentés par batteries qui peuvent voyager beaucoup plus loin, avec plus de cargaison.
ff-battery-charging=Transporter de l'électricité à l'aide de batteries chargées.
ff-battery-pack=Entreposage d'électricité plus dense et plus fiable.
ff-cobalt-processing=Découvrez la croûte de cobalt dans les monts sous-marins, utile pour la technologie de batterie avancée et comme une source infinie de plomb et de titane.
ff-titansteel-processing=Fondre l'acier titan dans des bassins de lave naturels. Le processus de refroidissement génère de la vapeur qui peut être transformée en électricité.
landfill=Peut être placé sur une eau peu profonde pour créer un terrain sur lequel vous pouvez construire.
lex-flying-cargo-ships=Un aéronef sans arme à longue portée, utile pour construire des avant-postes à distance sur d'autres îles.
ff-rocket-silo=Permet de lancer des fusées dans l'espace.\nLes silos de fusée ne peuvent qu'être placés dans des trous de silo de fusée naturels.
ff-interstellar-communication=Permet de lancer un communicateur interstellaire dans l'espace et de gagner la partie.

