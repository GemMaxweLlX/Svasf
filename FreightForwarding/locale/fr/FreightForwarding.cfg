[item-description]
ff-swamp-cable=Câble isolé par de la pourriture et de la fibre de carbone, posé à travers les marais de Gleba entre deux atterrages. Fabriqué uniquement sur Gleba.
ff-subsea-cable=Câble armé posé sur le fond marin entre deux atterrages sur Nauvis. Un par case de distance. Fabriqué uniquement sur Nauvis.
ff-light-space-platform-starter-pack=Assez léger (500 kg) pour le silo à fusée léger. Contient moins de dalles de fondation.
ff-reefer-container=Transporte des objets périssables. Le contenu s'avarie 5 fois plus lentement. Fabriqué sur Gleba.
ff-cryo-container=Transporte des objets périssables, qui s'avarient 20 fois plus lentement. Un cryoconteneur plein a un poids fixe. Fabriqué sur Aquilo.
ff-light-container=Un conteneur léger plein pèse toujours la même chose, quel que soit son contenu (voir son poids). Fabriqué sur Vulcanus.
ff-freight-science-pack=Assemblé sur Aquilo à partir de pièces de chaque planète.
ff-deformed-titansteel-plate=Du titanacier chaud qui a refroidi tout seul. La fonderie ne peut que le refondre en acier et en titane.
ff-damaged-container=Revenu endommagé du déchargement. Réparez-le pour un quart de ses matériaux, ou recyclez-le.
ff-freight-consignment=Les marchandises de cinq mondes, scellées pour un voyage de cent ans. Le conteneur léger devient une partie du blindage de la cargaison et part avec elle vers d'autres étoiles. La Longue Caravane les prend au bord du système solaire.
battery=Contient 4 MJ une fois chargée.
ff-battery-pack=Contient 10 MJ une fois chargée.
landfill=Peut être placé sur une eau peu profonde pour créer un terrain sur lequel vous pouvez construire.
bbr-rail-common=Ne peut pas être placé sur une eau profonde.
ff-interstellar-communicator=Peut être lancé dans une fusée pour gagner la partie.

