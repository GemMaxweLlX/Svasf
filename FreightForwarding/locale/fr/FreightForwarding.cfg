victory-message=Le premier navire de la caravane a emporté les marchandises de cinq mondes dans le noir entre les étoiles. Votre usine est désormais connue au-delà du système solaire, et d'autres navires arrivent.
victory-title=Membre de la Longue Caravane
pickup=Un navire de la caravane est passé au bord et a pris __1__ lots (__2__ / __3__).
signal=Signal venu d'au-delà du bord : la Longue Caravane passe par ce système et prend le fret au vol. Les marchandises de cinq mondes, scellées pour cent ans. Choisissez un contrat dans le panneau des contrats (bouton de la barre de raccourcis) et amenez des lots sur une plateforme au bord du système solaire.
accepted=Contrat __1__ accepté : __2__, __3__ × [item=__4__].
new-offers=De nouveaux navires de la caravane arrivent : choisissez le contrat __1__ dans le panneau des contrats.
fulfilled-type=Contrat __1__ (__2__) rempli ! Le navire est chargé et repart dans le noir. Récompense : __3__.
refreshed=De nouveaux navires de la caravane passent : les offres de contrat ont changé.
penalty=Pénalité de retard : +__1__ lots, le contrat en demande maintenant __2__.
overdue=Le contrat __1__ est en retard ! Le navire de la caravane attend, mais toutes les 10 minutes il en demande davantage.
reputation-up=Livré à temps : réputation +__1__ (maintenant __2__).
reputation-down=Livré en retard : réputation −__1__ (maintenant __2__). Une mauvaise réputation agrandit les contrats.
rare-unlocked=La caravane vous fait confiance désormais : des navires rares proposeront des contrats.

