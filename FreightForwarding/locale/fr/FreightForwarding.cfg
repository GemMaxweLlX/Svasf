[mod-setting-description]
ff-delivery-permits=Mécanique exclusive de FF + Space Age : les technologies clés demandent d'abord une autorisation, accordée en livrant un conteneur à un poste de recherche qui apparaît près de la zone explorée d'une planète.
ff-island-terrain-by-default=Utiliser le terrain insulaire de Freight Forwarding pour Nauvis même si le préréglage « Freight Forwarding » n'est pas choisi (par ex. préréglage par défaut ou partie Space Age).
ff-classic-mode=Freight Forwarding exactement comme en 1.x, même avec Space Age : bassins de lave, cobalt et titanacier sur Nauvis, un seul silo qui demande un cratère sur Nauvis, pièces de fusée avec cadres en titanacier et blocs-batteries. Les autres planètes restent comme dans Space Age. Désactivé : mode étendu, avec les fonctionnalités Space Age de ce mod.
ff-transport-science-planet-techs=Si désactivé, les technologies qui demandent la science d'une autre planète n'ont pas besoin de science du transport.
ff-wagon-mk2-capacity=Capacité des wagons Mk2 par rapport aux wagons normaux.
ff-heavy-ship-speed=Vitesse du cargo lourd (cale ×2) par rapport au cargo normal.
ff-swamp-ship-speed=Limite de vitesse des navires (sauf barges des marais) dans les marais de Gleba, en part de leur vitesse maximale.
ff-dredger-productivity-modules=Les monts sous-marins ne s'épuisent jamais : les modules de productivité rendent le dragage très puissant.
ff-scrap-dredging-amount=Combien de ferraille une drague tire d'un mont sous-marin par cycle (50 s à vitesse 1).
ff-fluorine-seep-yield=Rendement des sources de fluor sur Aquilo, en % d'un gisement de pétrole normal.
ff-light-container-weight=Poids fixe d'un conteneur léger ou cryo plein dans une fusée. 1000 kg = aucun gain par rapport au vrac.
ff-freight-contract-size=Combien de lots de fret il faut livrer au bord du système solaire pour gagner.
ff-contract-penalty=Après le délai, toutes les 10 minutes, le contrat grossit de cette part de sa taille, jusqu'à ce qu'il soit rempli.
ff-contract-deadline=Temps pour remplir un contrat de taille de base après l'avoir accepté ; les plus gros contrats ont proportionnellement plus.
ff-contract-refresh=Toutes les offres sont remplacées par de nouvelles à cette fréquence.
ff-contract-offer-lifetime=Une offre non acceptée dans ce délai (±25 %) disparaît.
ff-revert-locomotive-fuel-category=Permet aux locomotives d'utiliser du carburant thermique au lieu d'être alimenté par batterie. Activer si vous mettez à jour à partir d'une version antérieur de Freight Forwarding et que vous ne voulez pas refaire votre ravitaillement.\nCe paramètre pourrait disparaître dans les versions futures.

