[tips-and-tricks-item-description]
ff-sa-permits=Certaines technologies clés demandent d'abord une autorisation. Elle ne se recherche pas en laboratoire : dès qu'elle est disponible, un poste de recherche endommagé apparaît près de la zone explorée de la planète (marqueur de carte et message). Livrez les matériaux de réparation affichés au-dessus pour le restaurer, puis le conteneur demandé : il est consommé, une capsule de fret emporte les archives et la technologie clé se recherche normalement. 5 minutes plus tard, le poste s'autodétruit.
ff-sa-freight-contract=La Longue Caravane, des cargos interstellaires sur une route longue de plusieurs siècles, ne peut pas se permettre de freiner. Au bord du système solaire, elle prend la cargaison au vol sur les plateformes qui l'attendent. Assemblez des [item=ff-freight-consignment] avec les marchandises de chaque planète, amenez-les sur une plateforme au bord et gardez-les dans son hub. Les lots partent pour de bon avec la caravane, conteneurs légers compris. Choisissez l'un des trois contrats dans le panneau des contrats (bouton de la barre de raccourcis) : chaque navire veut une quantité différente et paie autrement (robots, extraction, recherche, bras robotisés, fabrication manuelle). Atteindre le bord ne suffit pas pour gagner.
ff-sa-hot-titansteel=Le titanacier chaud doit être refroidi en moins de 2 minutes. Sinon il se déforme, et la fonderie ne peut que le refondre en acier et en titane.
ff-sa-spoilage-sensor=Placez un [item=ff-spoilage-sensor] à moins de 4 cases d'un arrêt de train. Il indique l'avarie de la cargaison du train arrêté en pourcentage, pour les conditions d'attente par signal.
ff-sa-fluorine-seeps=Les sources de fluor au fond de l'océan ammoniacal d'Aquilo sont pompées par la plateforme pétrolière.
ff-sa-icebreaker=Sur Aquilo, le [item=ff-icebreaker] transforme la glace autour de lui en glace brisée, et l'on peut prolonger les voies navigables dans la glace.
ff-sa-swamp-barges=Dans les marais de Gleba, les navires vont beaucoup plus lentement. La [item=ff-swamp-barge] à fond plat garde sa pleine vitesse.
ff-sa-lava-barges=Sur Vulcanus, on peut construire des voies navigables sur la lave. Les navires ordinaires y brûlent ; la [item=ff-lava-barge] a un bouclier thermique.
ff-sa-bridges=Les supports de rail ne tiennent pas en eau profonde : les rails surélevés ne franchissent que les détroits peu profonds. La pleine mer demande toujours des navires.
ff-sa-dredgers=Les dragues fonctionnent aussi sur d'autres planètes : évents de cobalt dans la lave de Vulcanus, monts sous-marins de ferraille dans l'océan de pétrole profond de Fulgora. Les dragues Mk2 (Vulcanus) et Mk3 (Aquilo) sont plus grandes et plus rapides, acceptent des modules (sans productivité) et posent des plateformes plus grandes. Les plateformes ne recouvrent ni voies navigables, ni rails, ni trains.
ff-sa-damaged-containers=Au déchargement, 2 % des conteneurs reviennent endommagés et 1 % sont perdus. Réparez-les à la main pour un quart de leurs matériaux, ou jetez-les dans un recycleur.
ff-sa-container-tiers=Les conteneurs ont quatre niveaux : [item=ic-container] normal, [item=ff-reefer-container] frigorifique (Gleba, avarie 5× plus lente), [item=ff-light-container] léger (Vulcanus, poids fixe en fusée) et [item=ff-cryo-container] cryo (Aquilo, avarie 20× plus lente). Chacun a ses onglets de chargement et de déchargement. Un conteneur avarié contient ce en quoi son contenu s'avarie.
ff-sa-planet-chains=Chaque planète fabrique ce qu'elle seule peut faire : titane et plomb sur Nauvis, cobalt et titanacier sur Vulcanus, blocs-batteries cobalt-holmium sur Fulgora, conteneurs frigorifiques sur Gleba, blocs au lithium et science du fret sur Aquilo. Les batteries se rechargent partout.
ff-sa-rocket-tiers=Le premier [item=ff-light-rocket-silo] emporte 500 kg et, sur Nauvis, doit être construit exactement dans un cratère. Le [item=rocket-silo] normal (1 t) se débloque avec la science de la première planète visitée et ne se fabrique que là-bas ; il se construit n'importe où. Le [item=ff-heavy-rocket-silo] (2 t) vient d'Aquilo.
ff-vanilla=Ce groupe contient tous les trucs et astuces du jeu de base.
freight-forwarding=Bienvenue dans Freight Forwarding !\n\nVous devez lancer un [item=ff-interstellar-communicator] dans l'espace pour gagner la partie.\n\nDes captures d'écran et des vidéos de démonstration seront ajoutées dans une future mise à jour.
ff-containerization=Les conteneurs sont une nouvelle façon de transporter des éléments.\nCeux-ci sont chargés dans des conteneurs avec une [entity=ic-containerization-machine-1]. Chaque conteneur peut contenir 20 piles de cet objet. Les trains et les navires ont des stocks extrêmement faibles, c'est pourquoi il est essentiel de conteneuriser le fret avant le transport. Si un élément ne peut pas être conteneurisé, alors c'est une indication que vous devriez la traiter là où elle se trouve plutôt que de la charger sur des trains et des navires.
ff-container-limits=Les conteneurs ne peuvent pas être transportés par des robots. Il existe des moyens d'y arriver, mais il ne faut pas les utiliser et ils pourraient être corrigé dans une mise à jour future.\n\nLes Spidertrons et les aéronefs peuvent transporter les conteneurs vides, mais pas les remplis.
ff-water-types=Il y a trois types d'eau : peu profonde, régulière et profonde.\n\nLes personnages, les véhicules et les aliens peuvent tous traversés les eaux peu profondes. L'eau peu profonde peut être créé à l'aide de [item=waterfill-item].\nLes remblais et les ponts ferroviaires peuvent seulement être placé en eau peu profonde ou régulière. Un remblai peut être retiré en faisant __ALT_CONTROL__2__mine__ dessus avec une tuile en main.\nL'eau profonde contient du pétrole en mer et des monts sous-marins, et peut seulement être traversé par bateau, aéroglisseur et aéronef.
ff-oil=Le pétrole ne peut être obtenu qu'à partir de gisements pétroliers en mer. Chaque navire-citerne peut être chargé avec jusqu'à trois [entity=pompe]. Tenez une pompe en main pour voir les positions de placement valides.\nPomper directement de la foreuse de pétrole au navire-citerne est beaucoup plus rapide que de pomper à partir des tuyaux sous-marins.
ff-power=Il n'y a aucun moyen de transférer de l'électricité sur les océans à l'aide de poteaux électriques. Au lieu de cela, vous devez mettre en place une production d'énergie individuelle sur chaque île, ou stocker de l'électricité dans [item=ff-charged-battery] à l'aide d'une [entity=station-chargement] et les transporter par bateau ou aéronef.
ff-fuel=Certains véhicules ont des besoins uniques en carburant.\n\nLes voitures, les tanks, les navires et les aéronefs acceptent tous les types de carburant habituels : [item=wood] [item=coal] [item=solid-fuel] [item=rocket-fuel] [item=nuclear-fuel]\n[entity=mini-locomotive] n'accepte que les types de carburant de base : [item=wood] [item=coal] [item=solid-fuel]\n[entity=locomotive] n'acceptent que les batteries : [item=ff-charged-battery] [item=ff-charged-battery-pack] et produisent des batteries vides qui doivent être enlevées et rechargées. Les batteries ont une petite chance de se briser pendant la charge.
ff-dredging=Les plateformes de dragage peuvent être placées sur des monts sous-marins.\nDraguer pour [item=ff-ferrous-nodule] et [item=ff-cupric-nodule] permet une production infinie de [item=iron-ore], [item=copper-ore], and [item=stone], pour supplémenter la production régulière de ressource.\nDraguer pour [item=ff-cobalt-crust] permet une production infinie de [item=ff-cobalt-ore], qui n'est généré nul part ailleurs.\nLes nodules et les croûtes ont une faible taille de pile et ne peuvent être chargés dans des conteneurs, alors il est recommandé de les transformer en minerais directement sur la platforme de dragage.\n\nLes convoyeurs sousterrains ne peuvent pas être placés sur une platforme de dragage.
ff-rocket-silo=Les silos de fusée ne peuvent qu'être placés dans des trous de silo de fusée naturels.\nVous devez lancer plusieurs [item=satellite] pour permettre la recherche du [item=ff-interstellar-communicator] nécessaire pour gagner la partie.

